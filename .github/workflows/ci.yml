name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - open

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Python
        run: python -m compileall core tests scripts
      - name: Check unused imports
        run: python scripts/check_unused_imports.py

  frontend-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/agents
          - apps/base-shell
          - apps/chat
          - apps/dynamic-views
          - apps/storage
          - apps/skills
          - apps/settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: "${{ matrix.app }}/package-lock.json"
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
      - name: Test when available
        working-directory: ${{ matrix.app }}
        run: npm test --if-present

  committed-dist:
    runs-on: ubuntu-latest
    needs:
      - frontend-builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Rebuild source frontends and check committed dist
        run: |
          for app in apps/agents apps/base-shell apps/chat apps/dynamic-views apps/storage apps/skills apps/settings; do
            (cd "$app" && npm ci && npm run build)
          done
          git diff --exit-code -- apps/*/frontend/dist

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene
        run: |
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f .env.example
          if git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|\.maverick|logs|tmp|output)(/|$)|\.pyc$|^\.codex$'; then
            echo "Tracked local state or cache artifacts found"
            exit 1
          fi

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v4
