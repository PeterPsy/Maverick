name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - open

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: PWA cache policy and retry audit
        run: python scripts/audit_pwa_cache.py
      - name: Compile Python
        run: python -m compileall core tests scripts
      - name: Check unused imports
        run: python scripts/check_unused_imports.py

  inter-agent-maf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with MAF extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[inter-agent-maf]"
      - name: MAF source-backed fixtures
        env:
          MAVERICK_EXPERIMENTAL_AGENT_FRAMEWORK: "1"
        run: >
          python -m unittest
          tests.unit.inter_agent.test_maf_handoff_adapter
          tests.unit.inter_agent.test_maf_group_chat_adapter
          tests.unit.inter_agent.test_maf_magentic_adapter
          tests.integration.inter_agent.test_maf_handoff_fixture
          tests.integration.inter_agent.test_maf_group_chat_fixture
          tests.integration.inter_agent.test_maf_magentic_fixture

  frontend-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/agents
          - apps/base-shell
          - apps/chat
          - apps/dynamic-views
          - apps/storage
          - apps/skills
          - apps/settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: "${{ matrix.app }}/package-lock.json"
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
      - name: Test when available
        working-directory: ${{ matrix.app }}
        run: npm test --if-present
      - name: Install Chat Playwright browsers
        if: matrix.app == 'apps/chat'
        working-directory: ${{ matrix.app }}
        run: npx playwright install --with-deps chromium
      - name: Chat browser smoke tests
        if: matrix.app == 'apps/chat'
        working-directory: ${{ matrix.app }}
        run: npm run test:e2e

  pwa-cache-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: |
            apps/base-shell/package-lock.json
            apps/chat/package-lock.json
            apps/settings/package-lock.json
            apps/website-studio/package-lock.json
            packages/pwa-cache/package-lock.json
      - name: Install Core and PWA frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm --prefix packages/pwa-cache ci
          npm --prefix apps/base-shell ci
          npm --prefix apps/chat ci
          npm --prefix apps/settings ci
          npm --prefix apps/website-studio ci
      - name: Typecheck PWA SDK
        run: npm --prefix packages/pwa-cache run typecheck
      - name: Run complete PWA SDK hardening suite
        run: npm --prefix packages/pwa-cache test -- --maxWorkers=1
      - name: Run worker, build, and broker protocol tests
        run: npm --prefix apps/base-shell run test:service-worker
      - name: Run Settings cache interaction tests
        run: npm --prefix apps/settings test -- --maxWorkers=1
      - name: Run Website Studio derived-cache recovery tests
        run: npm --prefix apps/website-studio test -- --maxWorkers=1
      - name: Install Chromium for Website Studio preview recovery
        working-directory: apps/website-studio
        run: npx playwright install --with-deps chromium
      - name: Recover Website Studio previews and warmed routes
        run: npm --prefix apps/website-studio run test:visual -- website-studio-recovery.spec.ts --workers=1
      - name: Install Chromium for authenticated isolated-frame smoke
        working-directory: apps/chat
        run: npx playwright install --with-deps chromium
      - name: Authenticated Settings cache and shell recovery smoke
        run: python scripts/pwa_shell_cache_smoke.py

  committed-dist:
    runs-on: ubuntu-latest
    needs:
      - frontend-builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Rebuild source frontends and check committed dist
        run: |
          for app in apps/agents apps/base-shell apps/chat apps/dynamic-views apps/storage apps/skills apps/settings; do
            (cd "$app" && npm ci && npm run build)
          done
          git diff --exit-code -- apps/*/frontend/dist

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene
        run: |
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f .env.example
          if git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|\.maverick|logs|tmp|output)(/|$)|\.pyc$|^\.codex$'; then
            echo "Tracked local state or cache artifacts found"
            exit 1
          fi

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v4
