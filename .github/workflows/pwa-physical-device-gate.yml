name: PWA Physical Device Release Gate

on:
  schedule:
    # Monthly verification leaves substantial margin below the 90-day evidence TTL.
    - cron: "17 4 1 * *"
  release:
    types: [prereleased, published]
  workflow_call:
    inputs:
      evidence_json:
        description: Redaction-reviewed maverick.pwa-cache-device-regression.v1 JSON
        required: false
        type: string
  workflow_dispatch:
    inputs:
      evidence_json:
        description: Redaction-reviewed maverick.pwa-cache-device-regression.v1 JSON
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-physical-device-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize redaction-safe evidence
        env:
          PWA_DEVICE_EVIDENCE_JSON: ${{ inputs.evidence_json || vars.PWA_DEVICE_EVIDENCE_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("PWA_DEVICE_EVIDENCE_JSON", "").strip()
          if not raw:
              raise SystemExit(
                  "PWA device evidence is required: pass evidence_json or configure "
                  "the PWA_DEVICE_EVIDENCE_JSON repository variable."
              )
          payload = json.loads(raw)
          Path("pwa-device-evidence.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Enforce current and complete physical-device matrix
        run: python scripts/pwa_device_regression.py verify --input pwa-device-evidence.json
