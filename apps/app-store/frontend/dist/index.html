<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maverick App Store</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1&opsz=20..48&wght@400..700&display=swap"
    />
    <link rel="stylesheet" href="/apps/app-store/assets/main.css?v=20260514-stale-pin-cleanup" />
    <link rel="stylesheet" href="/apps/app-store/assets/app-folders.css?v=20260514-stale-pin-cleanup" />
    <link rel="stylesheet" href="/apps/app-store/assets/app-folder-lightbox.css?v=20260514-stale-pin-cleanup" />
  </head>
  <body>
    <main class="store-shell">
      <section class="today-section" id="today" aria-labelledby="todayTitle">
        <header class="detail-header store-header">
          <div class="detail-title-block">
            <h2 id="todayTitle">App Store</h2>
            <span class="detail-title-separator" aria-hidden="true"></span>
            <p>Discover Maverick apps ready to install, update, or add to your workspace.</p>
          </div>
        </header>
        <section class="catalog-folder-section" id="catalog" aria-label="App folders">
          <div id="catalogGrid" class="app-list app-list--store"></div>
        </section>
        <section class="stale-pins-section" id="stalePinsSection" aria-labelledby="stalePinsTitle" hidden>
          <header class="stale-pins-header">
            <div>
              <p class="section-label">Pinned shortcuts</p>
              <h3 id="stalePinsTitle">Needs cleanup</h3>
            </div>
          </header>
          <div id="stalePinList" class="app-list stale-pin-list"></div>
        </section>
      </section>
    </main>
    <div class="app-modal-backdrop is-hidden" id="promotionModal" aria-hidden="true">
      <div class="app-modal" role="dialog" aria-modal="true" aria-labelledby="promotionModalTitle">
        <div class="app-modal__header">
          <div>
            <p class="section-label">Promotion</p>
            <h2 id="promotionModalTitle">Promote app</h2>
          </div>
          <button class="app-modal__close" id="promotionModalClose" type="button" aria-label="Close promotion dialog">
            <span aria-hidden="true" class="material-symbols-rounded">close</span>
          </button>
        </div>
        <div class="app-modal__body" id="promotionModalBody"></div>
        <div class="app-modal__actions" id="promotionModalActions"></div>
      </div>
    </div>
    <script src="/apps/app-store/assets/frontend-presentation.js?v=20260514-stale-pin-cleanup"></script>
    <script src="/apps/app-store/assets/app-icons.js?v=20260810-design-studio-icon"></script>
    <script src="/apps/app-store/assets/app-folder-data.js?v=20260514-stale-pin-cleanup"></script>
    <script src="/apps/app-store/assets/app-folder-lightbox.js?v=20260514-stale-pin-cleanup"></script>
    <script src="/apps/app-store/assets/app-folders.js?v=20260514-stale-pin-cleanup"></script>
    <script src="/apps/app-store/assets/main.js?v=20260514-stale-pin-cleanup"></script>
  </body>
</html>
