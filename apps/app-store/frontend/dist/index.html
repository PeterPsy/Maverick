<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maverick App Store</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1&opsz=20..48&wght@400..700&display=swap"
    />
    <link rel="stylesheet" href="/apps/app-store/assets/main.css" />
  </head>
  <body>
    <main class="app-store-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Maverick</p>
          <h1>App Store</h1>
        </div>
        <button class="icon-button" id="refreshButton" type="button" title="Refresh catalog" aria-label="Refresh catalog">
          <span aria-hidden="true" class="material-symbols-rounded">refresh</span>
        </button>
      </header>
      <section class="workspace-strip" aria-label="Workspace selection">
        <div>
          <p class="section-label">Install target</p>
          <h2>Workspaces</h2>
        </div>
        <div id="workspaceList" class="workspace-list"></div>
      </section>
      <nav class="store-tabs" aria-label="App Store sections">
        <button class="store-tab is-active" type="button" data-tab="catalog">Catalog apps</button>
        <button class="store-tab" type="button" data-tab="installed">Installed apps</button>
        <button class="store-tab" type="button" data-tab="local">Local apps</button>
      </nav>
      <section class="catalog-section store-panel is-active" data-panel="catalog">
        <div class="catalog-header">
          <div>
            <p class="section-label">Store</p>
            <h2>Catalog apps</h2>
          </div>
          <div class="status-pill" id="statusText">Loading</div>
        </div>
        <div id="catalogGrid" class="app-list app-list--store"></div>
      </section>
      <section class="catalog-section store-panel" data-panel="installed">
        <div class="catalog-header">
          <div>
            <p class="section-label">Workspace</p>
            <h2>Installed apps</h2>
          </div>
        </div>
        <div id="installedList" class="app-list app-list--installed"></div>
      </section>
      <section class="catalog-section store-panel" data-panel="local">
        <div class="catalog-header">
          <div>
            <p class="section-label">Workspace-local</p>
            <h2>Local apps</h2>
          </div>
        </div>
        <div id="localList" class="app-list app-list--local"></div>
      </section>
    </main>
    <script src="/apps/app-store/assets/main.js"></script>
  </body>
</html>
