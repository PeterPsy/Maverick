<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maverick App Store</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1&opsz=20..48&wght@400..700&display=swap"
    />
    <link rel="stylesheet" href="/apps/app-store/assets/main.css?v=20260512-skeleton-loading" />
    <link rel="stylesheet" href="/apps/app-store/assets/app-folders.css?v=20260514-folder-carousel" />
    <link rel="stylesheet" href="/apps/app-store/assets/app-folder-lightbox.css?v=20260514-folder-carousel" />
  </head>
  <body>
    <main class="store-shell">
      <section class="today-section" id="today" aria-labelledby="todayTitle">
        <header class="detail-header store-header">
          <div class="detail-title-block">
            <h2 id="todayTitle">App Store</h2>
            <span class="detail-title-separator" aria-hidden="true"></span>
            <p>Scopri app Maverick pronte da installare, aggiornare o portare nel tuo workspace.</p>
          </div>
          <div class="action-group">
            <span class="status-pill" id="statusText">Loading</span>
            <button class="icon-button" id="refreshButton" type="button" title="Refresh catalog" aria-label="Refresh catalog">
              <span aria-hidden="true" class="material-symbols-rounded">refresh</span>
            </button>
          </div>
        </header>
        <section class="catalog-folder-section" id="catalog" aria-label="App folders">
          <div id="catalogGrid" class="app-list app-list--store"></div>
        </section>
      </section>
    </main>
    <div class="app-modal-backdrop is-hidden" id="promotionModal" aria-hidden="true">
      <div class="app-modal" role="dialog" aria-modal="true" aria-labelledby="promotionModalTitle">
        <div class="app-modal__header">
          <div>
            <p class="section-label">Promotion</p>
            <h2 id="promotionModalTitle">Promote app</h2>
          </div>
          <button class="app-modal__close" id="promotionModalClose" type="button" aria-label="Close promotion dialog">
            <span aria-hidden="true" class="material-symbols-rounded">close</span>
          </button>
        </div>
        <div class="app-modal__body" id="promotionModalBody"></div>
        <div class="app-modal__actions" id="promotionModalActions"></div>
      </div>
    </div>
    <script src="/apps/app-store/assets/app-icons.js?v=20260512-app-icons"></script>
    <script src="/apps/app-store/assets/app-folder-data.js?v=20260514-folder-carousel"></script>
    <script src="/apps/app-store/assets/app-folder-lightbox.js?v=20260514-folder-carousel"></script>
    <script src="/apps/app-store/assets/app-folders.js?v=20260514-folder-carousel"></script>
    <script src="/apps/app-store/assets/main.js?v=20260514-folder-carousel"></script>
  </body>
</html>
