<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f10" />
    <meta name="application-name" content="Maverick" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maverick" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        var mode = "dark";
        try {
          var raw = window.localStorage && window.localStorage.getItem("maverick:base-shell:session");
          var parsed = raw ? JSON.parse(raw) : {};
          if (parsed.themeMode === "dark" || parsed.themeMode === "light" || parsed.themeMode === "system") {
            mode = parsed.themeMode;
          }
        } catch (error) {
          mode = "dark";
        }
        var effective = mode;
        if (mode === "system") {
          effective = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.maverickTheme = effective;
        document.documentElement.dataset.theme = effective;
        document.documentElement.style.colorScheme = effective;
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any"  />
    <link rel="icon" type="image/png" sizes="512x512" href="/apps/base-shell/pwa-logo.png" />
    <link rel="apple-touch-icon" href="/apps/base-shell/pwa-apple-touch-icon.png" />
