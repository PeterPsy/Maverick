<!doctype html>
<html lang="it">

      p { margin: 0; color: rgba(248,248,246,.72); line-height: 1.55; }

      a { display: inline-flex; margin-top: 1.35rem; min-height: 2.75rem; align-items: center; padding: .65rem 1rem; border-radius: 999px; color: #111214; background: #f8f8f6; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #8dc8ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <img src="/apps/base-shell/maverick-mark.svg" alt="" />
