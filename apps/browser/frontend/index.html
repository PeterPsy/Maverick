<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the shell's effective theme before styles or the deferred app bundle.
    (() => {
      const params = new URLSearchParams(location.search);
      const value = params.get("loopino_theme") || params.get("loopino_color_scheme");
      const theme = value === "light" ? "light" : "dark";
      document.documentElement.dataset.loopinoTheme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <title>Loopino Browser</title>
  <link rel="icon" href="/apps/browser/icon.svg">
</head>
<body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
