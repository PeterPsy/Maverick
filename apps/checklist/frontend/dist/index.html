<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checklist</title>
    <style>
      :root {
        font-family: Inter, "Sohne", "Avenir Next", "Segoe UI", sans-serif;
        color-scheme: dark;
        --brand-500: #d72451;
        --brand-600: #b81e44;
        --text-on-brand: #ffffff;
        --surface-brand-soft: color-mix(in srgb, var(--brand-500) 8%, #2a2a2a);
        --maverick-bg: #1f1f1f;
        --maverick-bg-strong: #171717;
        --maverick-surface: #2a2a2a;
        --maverick-surface-soft: #252525;
        --maverick-surface-hover: #2f2f2f;
        --maverick-border: rgba(255, 255, 255, 0.08);
        --maverick-border-strong: rgba(255, 255, 255, 0.13);
        --maverick-text: #ececec;
        --maverick-text-muted: rgba(236, 236, 236, 0.64);
        --maverick-text-soft: rgba(236, 236, 236, 0.42);
        --maverick-primary: var(--brand-500);
        --maverick-primary-strong: var(--brand-600);
        --maverick-focus: rgba(215, 36, 81, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top right, rgba(215, 36, 81, 0.08), transparent 28%),
          linear-gradient(180deg, #202020 0%, #171717 100%);
        color: var(--maverick-text);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.22);
        border: 2px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .app-shell {
        width: min(1400px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 20px 0 28px;
        display: grid;
        gap: 16px;
      }

      .checklist-eyebrow {
        margin: 0;
        color: var(--maverick-text-soft);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding: 4px 2px 0;
      }

      .hero h1,
      .hero p,
      .composer h2,
      .composer p,
      .checklist-checklists-board__title,
      .checklist-checklist-card__title,
      .checklist-checklist-card__hint,
      .checklist-empty-panel__title,
      .checklist-empty-panel__description,
      .checklist-checklist-section__title {
        margin: 0;
      }

      .hero h1 {
        font-size: clamp(1.9rem, 2.7vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin-top: 0.35rem;
        color: var(--maverick-text-muted);
        line-height: 1.5;
      }

      .hero__actions {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-wrap: wrap;
      }

      .checklist-ui-surface {
        border: 1px solid var(--maverick-border);
        background: var(--maverick-surface);
        border-radius: 18px;
      }

      .checklist-ui-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        min-height: 40px;
        padding: 0 0.95rem;
        border: 1px solid transparent;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          opacity 180ms ease;
      }

      .checklist-ui-button:hover {
        transform: translateY(-1px);
      }

      .checklist-ui-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      .checklist-ui-button:focus-visible,
      .checklist-ui-input:focus-visible,
      .checklist-checklist-row__checkbox:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--maverick-focus);
      }

      .checklist-ui-button--primary {
        background: var(--maverick-primary);
        color: var(--text-on-brand);
      }

      .checklist-ui-button--primary:hover {
        background: var(--maverick-primary-strong);
      }

      .checklist-ui-button--secondary {
        border-color: var(--maverick-border);
        background: #2b2b2b;
        color: var(--maverick-text);
      }

      .checklist-ui-button--secondary:hover {
        border-color: var(--maverick-border-strong);
        background: #323232;
      }

      .checklist-ui-button--icon {
        width: 2.5rem;
        min-width: 2.5rem;
        padding: 0;
      }

      .checklist-ui-button--icon svg {
        width: 1rem;
        height: 1rem;
        stroke: currentColor;
      }

      .checklist-ui-field {
        display: grid;
        gap: 0.55rem;
      }

      .checklist-ui-field__label {
        color: var(--maverick-text-muted);
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .checklist-ui-field__message {
        color: var(--maverick-text-soft);
        font-size: 0.78rem;
      }

      .checklist-ui-field__message--error {
        color: #ffb3cf;
      }

      .checklist-ui-input {
        width: 100%;
        min-height: 42px;
        padding: 0.75rem 0.95rem;
        border: 1px solid var(--maverick-border);
        border-radius: 14px;
        background: #212121;
        color: var(--maverick-text);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .checklist-ui-input:hover {
        border-color: var(--maverick-border-strong);
      }

      .checklist-ui-input::placeholder {
        color: var(--maverick-text-soft);
      }

      textarea.checklist-ui-input {
        min-height: 96px;
        resize: vertical;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        min-height: 0;
        align-items: start;
      }

      .composer {
        padding: 0.95rem;
        display: grid;
        gap: 0.85rem;
        background:
          radial-gradient(circle at top right, rgba(215, 36, 81, 0.08), transparent 32%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.02));
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.18);
      }

      .composer h2 {
        font-size: 1.05rem;
        letter-spacing: -0.03em;
      }

      .composer p {
        color: var(--maverick-text-muted);
        font-size: 0.86rem;
        line-height: 1.55;
      }

      .composer__actions {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
      }

      .checklist-chat-empty {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
      }

      .checklist-chat-empty__panel {
        padding: 0.75rem;
      }

      .checklist-empty-panel__title {
        display: block;
        width: 100%;
        min-width: 0;
        overflow: hidden;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .checklist-empty-panel__description {
        color: var(--maverick-text-muted);
        line-height: 1.6;
      }

      .checklist-checklists-board {
        display: grid;
        gap: 1rem;
        align-content: start;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 0.25rem 0 1rem;
      }

      .checklist-checklists-board__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .checklist-checklists-board__title {
        font-size: 1.2rem;
        letter-spacing: -0.03em;
      }

      .checklist-checklists-board__list {
        display: grid;
        grid-auto-flow: dense;
        grid-auto-rows: 10px;
        grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
        gap: 1rem;
        align-items: start;
        align-content: start;
        min-width: 0;
      }

      .checklist-checklists-board__item {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 0.55rem;
        min-width: 0;
        padding: 0.55rem 0.55rem 0.45rem;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 26px;
        background:
          radial-gradient(circle at top right, rgba(215, 36, 81, 0.08), transparent 26%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.028), rgba(255, 255, 255, 0.012));
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.18);
      }

      .checklist-checklists-board__item[data-span="2"] {
        grid-column: span 2;
      }

      .checklist-checklists-board__item-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0 0.25rem;
        color: rgba(236, 236, 236, 0.48);
        font-size: 0.75rem;
      }

      .checklist-checklists-board__item-actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .checklist-checklists-board__item-card {
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }

      .checklist-checklists-board__icon-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.9rem;
        height: 1.9rem;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        color: rgba(236, 236, 236, 0.76);
        cursor: pointer;
        transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .checklist-checklists-board__icon-action:hover:not(:disabled) {
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: #ffffff;
      }

      .checklist-checklists-board__icon-action svg {
        width: 0.95rem;
        height: 0.95rem;
        stroke: currentColor;
      }

      .checklist-checklists-board__resize {
        position: absolute;
        right: 0.45rem;
        bottom: 0.45rem;
        width: 1.35rem;
        height: 1.35rem;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background:
          linear-gradient(135deg, transparent 0 48%, rgba(255, 255, 255, 0.16) 48% 54%, transparent 54% 100%),
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        cursor: nwse-resize;
        opacity: 0.72;
      }

      .checklist-checklists-board__resize:hover {
        opacity: 1;
      }

      .checklist-checklist-card {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 0.8rem;
        min-width: 0;
        padding: 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 22px;
        background:
          radial-gradient(circle at 100% 0%, rgba(215, 36, 81, 0.1), transparent 28%),
          radial-gradient(circle at 0% 100%, rgba(167, 139, 250, 0.06), transparent 24%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.032), rgba(255, 255, 255, 0.014));
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.2);
      }

      .checklist-checklist-card--board {
        min-height: 0;
      }

      .checklist-checklist-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .checklist-checklist-card__header-copy {
        display: grid;
        gap: 0.18rem;
        min-width: 0;
        flex: 1 1 auto;
      }

      .checklist-checklist-card__header-actions {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .checklist-checklist-card__title {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .checklist-checklist-card__count {
        color: rgba(236, 236, 236, 0.42);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .checklist-checklist-card__body {
        min-height: 0;
      }

      .checklist-checklist-card--board .checklist-checklist-card__body {
        max-height: var(--checklist-board-body-max-height, none);
        overflow: auto;
        padding-right: 0.2rem;
      }

      .checklist-checklist-card__sections {
        display: grid;
        gap: 0.9rem;
      }

      .checklist-checklist-section {
        display: grid;
        gap: 0.35rem;
      }

      .checklist-checklist-section__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.55rem;
      }

      .checklist-checklist-section__title {
        display: block;
        color: rgba(236, 236, 236, 0.76);
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.45;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .checklist-checklist-card__rows {
        display: grid;
        gap: 0.2rem;
      }

      .checklist-checklist-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: start;
        gap: 0.65rem;
        min-height: 2.2rem;
        padding: 0.34rem 0.2rem;
        border-radius: 14px;
        transition:
          background 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .checklist-checklist-row:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .checklist-checklist-row:focus-within {
        background: rgba(255, 255, 255, 0.03);
      }

      .checklist-checklist-row__checkbox {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        width: 1.05rem;
        height: 1.05rem;
        margin: 0.16rem 0 0;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.08),
          0 0 0 0 rgba(215, 36, 81, 0);
        cursor: pointer;
        transition:
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      .checklist-checklist-row__checkbox:hover:not(:disabled) {
        border-color: rgba(215, 36, 81, 0.48);
      }

      .checklist-checklist-row__checkbox::after {
        content: "";
        position: absolute;
        inset: 0.2rem;
        border-radius: 999px;
        background: linear-gradient(180deg, #f84b78, #d72451);
        transform: scale(0.4);
        opacity: 0;
        transition:
          transform 180ms ease,
          opacity 180ms ease;
      }

      .checklist-checklist-row__checkbox:checked {
        border-color: rgba(215, 36, 81, 0.52);
        background: rgba(215, 36, 81, 0.08);
      }

      .checklist-checklist-row__checkbox:checked::after {
        transform: scale(1);
        opacity: 1;
      }

      .checklist-checklist-row__checkbox:disabled {
        cursor: default;
        opacity: 0.42;
      }

      .checklist-checklist-row__input {
        display: block;
        width: 100%;
        min-width: 0;
        color: var(--maverick-text);
        font-size: 0.92rem;
        line-height: 1.45;
        letter-spacing: -0.01em;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      .checklist-editor-input {
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
      }

      .checklist-editor-input::placeholder {
        color: var(--maverick-text-soft);
      }

      .checklist-editor-input:focus-visible {
        outline: none;
      }

      .checklist-checklist-card__title-input {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .checklist-checklist-section__input {
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.45;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .checklist-checklist-row__text {
        display: block;
        width: 100%;
        min-width: 0;
      }

      .checklist-checklist-row.is-checked .checklist-checklist-row__input {
        color: rgba(236, 236, 236, 0.5);
        text-decoration: line-through;
        text-decoration-thickness: 1px;
        text-decoration-color: rgba(215, 36, 81, 0.5);
      }

      .checklist-checklist-row__delete {
        width: 1.4rem;
        height: 1.4rem;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(236, 236, 236, 0.26);
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 180ms ease,
          color 180ms ease,
          background 180ms ease;
      }

      .checklist-checklist-row:hover .checklist-checklist-row__delete,
      .checklist-checklist-row:focus-within .checklist-checklist-row__delete {
        opacity: 1;
        pointer-events: auto;
      }

      .checklist-checklist-row__delete:hover {
        background: rgba(255, 255, 255, 0.04);
        color: rgba(236, 236, 236, 0.72);
      }

      .checklist-checklist-card__footer {
        display: grid;
        gap: 0.55rem;
      }

      .checklist-checklist-card__hint {
        color: rgba(236, 236, 236, 0.42);
        font-size: 0.72rem;
      }

      .checklist-checklist-card__hint-input {
        color: rgba(236, 236, 236, 0.7);
        font-size: 0.72rem;
      }

      .status-inline {
        min-height: 1rem;
        color: #ffb3cf;
        font-size: 0.76rem;
      }

      @media (max-width: 1080px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 900px) {
        .checklist-checklists-board__list {
          grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
        }

        .checklist-checklists-board__item[data-span="2"] {
          grid-column: span 1;
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100vw - 20px, 720px);
          padding-top: 14px;
        }

        .hero,
        .checklist-checklists-board__header {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
        }

        .hero__actions,
        .checklist-checklists-board__header .checklist-ui-button {
          width: 100%;
        }

        .hero__actions .checklist-ui-button {
          flex: 1 1 auto;
        }

        .checklist-checklist-card {
          gap: 0.7rem;
          padding: 0.82rem;
          border-radius: 18px;
        }

        .checklist-checklist-card__header {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          align-items: start;
          gap: 0.5rem;
        }

        .checklist-checklist-card__header-actions {
          justify-content: space-between;
          gap: 0.5rem;
        }

        .checklist-checklist-card__title {
          font-size: 0.96rem;
        }

        .checklist-checklist-card__count,
        .checklist-checklist-card__hint,
        .checklist-checklist-section__title {
          font-size: 0.68rem;
        }

        .checklist-checklist-card--board {
          height: auto;
        }

        .checklist-checklist-card--board .checklist-checklist-card__body {
          overflow: visible;
          padding-right: 0;
        }

        .checklist-checklist-row {
          gap: 0.5rem;
          min-height: 2.5rem;
          padding: 0.32rem 0;
        }

        .checklist-checklist-row__checkbox {
          width: 1.15rem;
          height: 1.15rem;
        }

        .checklist-checklist-row__input {
          font-size: 16px;
        }

        .checklist-checklists-board {
          gap: 0.8rem;
          padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
        }

        .checklist-checklists-board__title {
          font-size: 1.06rem;
        }

        .checklist-checklists-board__list {
          grid-template-columns: 1fr;
          grid-auto-rows: auto;
          gap: 0.8rem;
        }

        .checklist-checklists-board__item {
          gap: 0.5rem;
          padding: 0.5rem 0.5rem 0.45rem;
          border-radius: 20px;
        }

        .checklist-checklists-board__item-meta {
          gap: 0.5rem;
          font-size: 0.7rem;
        }

      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="checklist-eyebrow">Workspace app</p>
          <h1>Checklist board</h1>
          <p>Checklist salvate con card ridimensionabili e widget coerente.</p>
        </div>
        <div class="hero__actions">
          <button aria-label="Crea checklist" class="checklist-ui-button checklist-ui-button--secondary checklist-ui-button--icon" id="create-empty" type="button">
            <svg fill="none" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
            </svg>
          </button>
        </div>
      </section>

      <section class="workspace">
        <section class="checklist-checklists-board">
          <header class="checklist-checklists-board__header">
            <div>
              <p class="checklist-eyebrow">Saved checklists</p>
              <h2 class="checklist-checklists-board__title">Checklist board</h2>
            </div>
          </header>
          <p class="status-inline" id="error"></p>
          <div class="checklist-checklists-board__list" id="board"></div>
        </section>
      </section>
    </main>
    <script>
      const BOARD_MIN_HEIGHT = 280;
      const BOARD_MAX_HEIGHT = 960;
      const BOARD_STORAGE_PREFIX = "checklist-board-size";
      const APP_ID = "checklist";
      const APP_EVENTS_WS_PATH = "/api/apps/events/ws";
      let activeLoadPromise = null;
      let pendingReload = false;
      let boardItems = [];
      let pendingFocus = null;
      const localVersions = new Map();
      const saveChains = new Map();

      const api = async (body) => {
        const response = await fetch("/api/apps/checklist/backend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok || data.error) {
          throw new Error(data.detail || data.error || "Errore checklist");
        }
        return data;
      };

      const esc = (value) =>
        String(value ?? "").replace(/[&<>\"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        }[char]));

      const clone = (value) => JSON.parse(JSON.stringify(value));

      const nextTempId = (prefix) => `${prefix}-${Math.random().toString(16).slice(2, 10)}`;

      const debugLog = (event, details = {}) => {
        console.debug("[checklist-board]", event, {
          ts: new Date().toISOString(),
          ...details
        });
      };

      const normalizedSummary = (item) => {
        const current = String(item.summary || "").trim();
        return current || `${countTasks(item).checked}/${countTasks(item).total} checked`;
      };

      const markDirty = (checklistId) => {
        const nextVersion = (localVersions.get(checklistId) || 0) + 1;
        localVersions.set(checklistId, nextVersion);
        return nextVersion;
      };

      const rememberFocus = (descriptor) => {
        debugLog("focus.remember", descriptor);
        pendingFocus = {
          rendersRemaining: descriptor.rendersRemaining || 6,
          ...descriptor
        };
      };

      const applyPendingFocus = () => {
        if (!pendingFocus) {
          return;
        }
        const selector = pendingFocus.field === "task-title"
          ? `[data-field="task-title"][data-checklist="${pendingFocus.checklistId}"][data-section="${pendingFocus.sectionId}"][data-task="${pendingFocus.taskId}"]`
          : pendingFocus.field === "section-title"
            ? `[data-field="section-title"][data-checklist="${pendingFocus.checklistId}"][data-section="${pendingFocus.sectionId}"]`
            : `[data-field="${pendingFocus.field}"][data-checklist="${pendingFocus.checklistId}"]`;
        const target = document.querySelector(selector);
        if (!(target instanceof HTMLInputElement)) {
          debugLog("focus.miss", { selector, pendingFocus });
          return;
        }
        const focusDescriptor = pendingFocus;
        window.requestAnimationFrame(() => {
          debugLog("focus.apply", {
            field: focusDescriptor.field,
            checklistId: focusDescriptor.checklistId,
            sectionId: focusDescriptor.sectionId,
            taskId: focusDescriptor.taskId,
            targetValue: target.value
          });
          target.focus();
          if (focusDescriptor.selectAll) {
            target.select();
          } else if (typeof focusDescriptor.cursorAtEnd === "boolean" && focusDescriptor.cursorAtEnd) {
            const end = target.value.length;
            target.setSelectionRange(end, end);
          }
        });
        focusDescriptor.rendersRemaining -= 1;
        if (focusDescriptor.rendersRemaining <= 0) {
          pendingFocus = null;
        }
      };

      const countTasks = (item) => {
        const tasks = (item.sections || []).flatMap((section) => section.tasks || []);
        const checked = tasks.filter((task) => task.checked).length;
        return { checked, total: tasks.length };
      };

      const findChecklist = (checklistId) => boardItems.find((item) => item.id === checklistId) || null;

      const findSection = (item, sectionId) => (item.sections || []).find((section) => section.id === sectionId) || null;

      const sanitizeSections = (sections) => {
        const normalized = (Array.isArray(sections) ? sections : []).map((section, sectionIndex) => ({
          id: String(section.id || `section-${sectionIndex + 1}`),
          title: String(section.title || ""),
          tasks: (Array.isArray(section.tasks) ? section.tasks : [])
            .map((task, taskIndex) => ({
              id: String(task.id || `task-${sectionIndex + 1}-${taskIndex + 1}`),
              title: String(task.title || "").trim(),
              checked: Boolean(task.checked)
            }))
        }));
        return normalized.length ? normalized : [{ id: "section-default", title: "", tasks: [] }];
      };

      const serializeChecklist = (item) => ({
        title: String(item.title || "Checklist").trim() || "Checklist",
        summary: String(item.summary || "").trim(),
        sections: sanitizeSections(item.sections)
      });

      const renderBoard = () => {
        debugLog("render.board", {
          items: boardItems.length,
          activeElement:
            document.activeElement instanceof HTMLInputElement
              ? {
                  field: document.activeElement.dataset.field || "",
                  checklistId: document.activeElement.dataset.checklist || "",
                  sectionId: document.activeElement.dataset.section || "",
                  taskId: document.activeElement.dataset.task || "",
                  value: document.activeElement.value
                }
              : null,
          pendingFocus
        });
        render(boardItems);
        applyPendingFocus();
      };

      const replaceChecklist = (checklist) => {
        boardItems = boardItems.map((item) => (item.id === checklist.id ? checklist : item));
      };

      const updateChecklistLocal = (checklistId, updater) => {
        let nextItem = null;
        boardItems = boardItems.map((item) => {
          if (item.id !== checklistId) {
            return item;
          }
          nextItem = clone(item);
          updater(nextItem);
          nextItem.task_count = countTasks(nextItem).total;
          nextItem.checked_count = countTasks(nextItem).checked;
          return nextItem;
        });
        markDirty(checklistId);
        return nextItem;
      };

      const queueSave = (checklistId) => {
        const version = localVersions.get(checklistId) || 0;
        const current = findChecklist(checklistId);
        if (!current || version === 0) {
          return Promise.resolve();
        }
        const snapshot = clone(current);
        debugLog("save.queue", {
          checklistId,
          version,
          sections: snapshot.sections?.length || 0,
          taskCount: countTasks(snapshot).total,
          pendingFocus
        });
        const previous = saveChains.get(checklistId) || Promise.resolve();
        const next = previous
          .catch(() => {})
          .then(async () => {
            debugLog("save.start", { checklistId, version });
            const result = await api({
              action: "update",
              id: checklistId,
              payload: serializeChecklist(snapshot)
            });
            if ((localVersions.get(checklistId) || 0) === version && result.checklist) {
              debugLog("save.success", {
                checklistId,
                version,
                serverUpdatedAt: result.checklist.updated_at || "",
                pendingFocus
              });
              replaceChecklist(result.checklist);
              localVersions.set(checklistId, 0);
              renderBoard();
            }
          })
          .catch((error) => {
            debugLog("save.error", { checklistId, version, message: error.message });
            document.getElementById("error").textContent = error.message;
          });
        saveChains.set(checklistId, next);
        return next.finally(() => {
          if (saveChains.get(checklistId) === next) {
            saveChains.delete(checklistId);
          }
        });
      };

      const insertTaskAfter = (checklistId, sectionId, taskId) => {
        const created = { id: nextTempId("task"), title: "", checked: false };
        debugLog("task.insert.request", { checklistId, sectionId, taskId, createdTaskId: created.id });
        updateChecklistLocal(checklistId, (item) => {
          const section = findSection(item, sectionId);
          if (!section) {
            return;
          }
          const tasks = Array.isArray(section.tasks) ? section.tasks : [];
          const index = Math.max(0, tasks.findIndex((task) => task.id === taskId));
          tasks.splice(index + 1, 0, created);
          section.tasks = tasks;
        });
        rememberFocus({ field: "task-title", checklistId, sectionId, taskId: created.id, selectAll: true });
        renderBoard();
        queueSave(checklistId);
      };

      const deleteTask = (checklistId, sectionId, taskId) => {
        let focusTarget = null;
        updateChecklistLocal(checklistId, (item) => {
          const section = findSection(item, sectionId);
          if (!section) {
            return;
          }
          const tasks = Array.isArray(section.tasks) ? section.tasks : [];
          const index = tasks.findIndex((task) => task.id === taskId);
          if (index < 0) {
            return;
          }
          const neighbor = tasks[index - 1] || tasks[index + 1] || null;
          tasks.splice(index, 1);
          section.tasks = tasks;
          if (neighbor) {
            focusTarget = {
              field: "task-title",
              checklistId,
              sectionId,
              taskId: neighbor.id,
              cursorAtEnd: true
            };
          } else {
            focusTarget = {
              field: "section-title",
              checklistId,
              sectionId,
              cursorAtEnd: true
            };
          }
        });
        if (focusTarget) {
          rememberFocus(focusTarget);
        }
        renderBoard();
        queueSave(checklistId);
      };

      const appendSection = (checklistId) => {
        const sectionId = nextTempId("section");
        updateChecklistLocal(checklistId, (item) => {
          item.sections = [
            ...(item.sections || []),
            {
              id: sectionId,
              title: "Nuova sezione",
              tasks: [{ id: nextTempId("task"), title: "", checked: false }]
            }
          ];
        });
        rememberFocus({ field: "section-title", checklistId, sectionId, selectAll: true });
        renderBoard();
        queueSave(checklistId);
      };

      const formatUpdatedAt = (value) => {
        const parsed = new Date(value || "");
        if (Number.isNaN(parsed.getTime())) {
          return "";
        }
        return new Intl.DateTimeFormat("it-IT", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(parsed);
      };

      const estimateChecklistHeight = (item) => {
        const sectionCount = (item.sections || []).length || 1;
        const taskCount = item.task_count || (item.sections || []).flatMap((section) => section.tasks || []).length;
        return Math.min(BOARD_MAX_HEIGHT, Math.max(BOARD_MIN_HEIGHT, 210 + sectionCount * 54 + taskCount * 28));
      };

      const getStoredChecklistSize = (itemId, item) => {
        try {
          const raw = window.localStorage.getItem(`${BOARD_STORAGE_PREFIX}:${itemId}`);
          if (!raw) {
            return { columnSpan: 1, height: estimateChecklistHeight(item) };
          }
          const parsed = JSON.parse(raw);
          return {
            columnSpan: parsed.columnSpan === 2 ? 2 : 1,
            height:
              typeof parsed.height === "number"
                ? Math.min(BOARD_MAX_HEIGHT, Math.max(BOARD_MIN_HEIGHT, parsed.height))
                : estimateChecklistHeight(item)
          };
        } catch {
          return { columnSpan: 1, height: estimateChecklistHeight(item) };
        }
      };

      const persistChecklistSize = (itemId, size) => {
        window.localStorage.setItem(`${BOARD_STORAGE_PREFIX}:${itemId}`, JSON.stringify(size));
      };

      const renderCard = (item) => {
        const counts = countTasks(item);
        const sections = (item.sections || []).map((section) => `
          <section class="checklist-checklist-section">
            <div class="checklist-checklist-section__header">
              <input
                class="checklist-editor-input checklist-checklist-section__title checklist-checklist-section__input"
                data-field="section-title"
                data-checklist="${esc(item.id)}"
                data-section="${esc(section.id)}"
                placeholder="Nuova sezione"
                value="${esc(section.title || "")}">
            </div>
            <div class="checklist-checklist-card__rows">
              ${(section.tasks || []).map((task) => `
                <div class="checklist-checklist-row ${task.checked ? "is-checked" : ""}">
                  <input
                    class="checklist-checklist-row__checkbox"
                    type="checkbox"
                    ${task.checked ? "checked" : ""}
                    data-checklist="${esc(item.id)}"
                    data-section="${esc(section.id)}"
                    data-task="${esc(task.id)}">
                  <span class="checklist-checklist-row__text">
                    <input
                      class="checklist-editor-input checklist-checklist-row__input"
                      data-field="task-title"
                      data-checklist="${esc(item.id)}"
                      data-section="${esc(section.id)}"
                      data-task="${esc(task.id)}"
                      placeholder="Nuovo task"
                      value="${esc(task.title || "")}">
                  </span>
                  <button
                    aria-label="Elimina task"
                    class="checklist-checklist-row__delete"
                    data-remove-task="true"
                    data-checklist="${esc(item.id)}"
                    data-section="${esc(section.id)}"
                    data-task="${esc(task.id)}"
                    type="button">×</button>
                </div>
              `).join("")}
            </div>
          </section>
        `).join("");

        return `
          <div class="checklist-checklist-card checklist-checklist-card--board">
            <div class="checklist-checklist-card__header">
              <div class="checklist-checklist-card__header-copy">
                <p class="checklist-eyebrow">Checklist</p>
                <input
                  class="checklist-editor-input checklist-checklist-card__title checklist-checklist-card__title-input"
                  data-field="title"
                  data-checklist="${esc(item.id)}"
                  value="${esc(item.title || "")}">
              </div>
              <div class="checklist-checklist-card__header-actions">
                <span class="checklist-checklist-card__count">${counts.checked}/${counts.total}</span>
              </div>
            </div>
            <div class="checklist-checklist-card__body">
              <div class="checklist-checklist-card__sections">${sections}</div>
            </div>
            <div class="checklist-checklist-card__footer">
              <input
                class="checklist-editor-input checklist-checklist-card__hint checklist-checklist-card__hint-input"
                data-field="summary"
                data-checklist="${esc(item.id)}"
                placeholder="Aggiungi un sommario"
                value="${esc(item.summary || "")}">
            </div>
          </div>
        `;
      };

      const render = (items) => {
        const board = document.getElementById("board");
        if (!items.length) {
          board.innerHTML = `
            <div class="checklist-chat-empty">
              <div class="checklist-ui-surface checklist-chat-empty__panel">
                <p class="checklist-empty-panel__title">Nessuna checklist</p>
                <p class="checklist-empty-panel__description">Crea la prima checklist oppure richiama il tool MCP checklist_tasklist.</p>
              </div>
            </div>`;
          return;
        }

        board.innerHTML = items.map((item) => {
          const size = getStoredChecklistSize(item.id, item);
          const isMobile = window.innerWidth <= 640;
          const bodyMaxHeight = isMobile ? "" : `--checklist-board-body-max-height: ${Math.max(110, size.height - 150)}px;`;
          return `
            <article
              class="checklist-checklists-board__item"
              data-item="${esc(item.id)}"
              data-span="${isMobile ? 1 : size.columnSpan}"
              data-mobile="${isMobile ? "true" : "false"}"
              style="${bodyMaxHeight}"
            >
              <div class="checklist-checklists-board__item-meta">
                <span>${esc(formatUpdatedAt(item.updated_at || item.created_at) || "Senza data")}</span>
                <div class="checklist-checklists-board__item-actions">
                  <button aria-label="Nuova sezione" class="checklist-checklists-board__icon-action" data-add-section="${esc(item.id)}" type="button">
                    <svg fill="none" viewBox="0 0 24 24">
                      <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                    </svg>
                  </button>
                  <button aria-label="Elimina checklist" class="checklist-checklists-board__icon-action" data-delete="${esc(item.id)}" type="button">
                    <svg fill="none" viewBox="0 0 24 24">
                      <path d="M4 7h16M9 7V5h6v2M10 11v6M14 11v6M7 7l1 12h8l1-12" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="checklist-checklists-board__item-card">${renderCard(item)}</div>
              ${isMobile ? "" : `<button aria-label="Ridimensiona checklist" class="checklist-checklists-board__resize" data-resize="${esc(item.id)}" type="button"></button>`}
            </article>`;
        }).join("");
        requestAnimationFrame(applyBoardMasonryLayout);
      };

      const renderError = (error) => {
        document.getElementById("board").innerHTML = `<div class="checklist-ui-surface checklist-chat-empty__panel"><p class="checklist-empty-panel__title">Errore checklist</p><p class="checklist-empty-panel__description">${esc(error.message)}</p></div>`;
      };

      const load = async () => {
        debugLog("load.start");
        const data = await api({ action: "list", limit: 500 });
        boardItems = data.items || [];
        boardItems.forEach((item) => localVersions.set(item.id, 0));
        debugLog("load.success", { items: boardItems.length });
        renderBoard();
      };

      const scheduleReload = () => {
        debugLog("reload.schedule", {
          activeLoad: Boolean(activeLoadPromise),
          pendingReload
        });
        if (activeLoadPromise) {
          pendingReload = true;
          return activeLoadPromise;
        }
        activeLoadPromise = load()
          .catch((error) => {
            renderError(error);
          })
          .finally(() => {
            activeLoadPromise = null;
            if (pendingReload) {
              pendingReload = false;
              scheduleReload();
            }
          });
        return activeLoadPromise;
      };

      const handleDataChanged = (payload) => {
        debugLog("event.dataChanged", payload || {});
        if (!payload || payload.type !== "maverick.app.data-changed") {
          return;
        }
        if (payload.owner_app_id && payload.owner_app_id !== APP_ID) {
          return;
        }
        if (payload.resource && payload.resource !== "state") {
          return;
        }
        scheduleReload();
      };

      const connectAppEvents = () => {
        window.addEventListener("message", (event) => {
          if (event.origin !== window.location.origin || !event.data || typeof event.data !== "object") {
            return;
          }
          handleDataChanged(event.data);
        });

        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "maverick.app.ready", app_id: APP_ID }, window.location.origin);
        }

        if (typeof WebSocket === "undefined") {
          return;
        }

        let socket = null;
        let reconnectTimer = 0;
        let closed = false;

        const connect = () => {
          const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
          socket = new WebSocket(`${protocol}//${window.location.host}${APP_EVENTS_WS_PATH}`);
          socket.onmessage = (message) => {
            try {
              handleDataChanged(JSON.parse(message.data));
            } catch {
              return;
            }
          };
          socket.onclose = () => {
            if (!closed) {
              reconnectTimer = window.setTimeout(connect, 1000);
            }
          };
          socket.onerror = () => {
            socket.close();
          };
        };

        connect();
        window.addEventListener("beforeunload", () => {
          closed = true;
          if (reconnectTimer) {
            window.clearTimeout(reconnectTimer);
          }
          if (socket) {
            socket.close();
          }
        }, { once: true });
      };

      const applyBoardMasonryLayout = () => {
        const board = document.getElementById("board");
        if (!board) {
          return;
        }
        const articles = Array.from(board.querySelectorAll(".checklist-checklists-board__item"));
        const isMobile = window.innerWidth <= 640;
        if (isMobile) {
          articles.forEach((article) => {
            article.style.gridRowEnd = "";
          });
          return;
        }
        const computed = window.getComputedStyle(board);
        const rowHeight = Number.parseFloat(computed.gridAutoRows || "10") || 10;
        const rowGap = Number.parseFloat(computed.rowGap || "16") || 16;
        articles.forEach((article) => {
          article.style.gridRowEnd = "";
          const height = article.getBoundingClientRect().height;
          const span = Math.max(1, Math.ceil((height + rowGap) / (rowHeight + rowGap)));
          article.style.gridRowEnd = `span ${span}`;
        });
      };

      const handleResizeStart = (event) => {
        const itemId = event.target.dataset.resize;
        if (!itemId || window.innerWidth <= 640) {
          return;
        }
        const article = event.target.closest("[data-item]");
        if (!article) {
          return;
        }

        event.preventDefault();

        const size = getStoredChecklistSize(itemId, {});
        const startX = event.clientX;
        const startY = event.clientY;
        const startHeight = size.height;
        const startSpan = size.columnSpan;

        const handlePointerMove = (nextEvent) => {
          const nextHeight = Math.min(BOARD_MAX_HEIGHT, Math.max(BOARD_MIN_HEIGHT, startHeight + nextEvent.clientY - startY));
          const nextSpan = window.innerWidth >= 1100 && nextEvent.clientX - startX > 140 ? 2 : startSpan;
          const collapsedSpan = nextEvent.clientX - startX < -140 ? 1 : nextSpan;
          const nextSize = { columnSpan: collapsedSpan, height: nextHeight };
          persistChecklistSize(itemId, nextSize);
          article.dataset.span = String(nextSize.columnSpan);
          article.style.setProperty("--checklist-board-body-max-height", `${Math.max(110, nextSize.height - 150)}px`);
          applyBoardMasonryLayout();
        };

        const handlePointerUp = () => {
          window.removeEventListener("pointermove", handlePointerMove);
          window.removeEventListener("pointerup", handlePointerUp);
        };

        window.addEventListener("pointermove", handlePointerMove);
        window.addEventListener("pointerup", handlePointerUp, { once: true });
      };

      document.getElementById("create-empty").addEventListener("click", async () => {
        const error = document.getElementById("error");
        error.textContent = "";
        try {
          const result = await api({
            action: "create",
            payload: {
              title: "Checklist",
              summary: "",
              sections: [{
                id: "section-default",
                title: "",
                tasks: [{ id: nextTempId("task"), title: "", checked: false }]
              }]
            }
          });
          if (result.checklist) {
            rememberFocus({
              field: "title",
              checklistId: result.checklist.id,
              selectAll: true,
              rendersRemaining: 3
            });
          }
          await scheduleReload();
        } catch (err) {
          error.textContent = err.message;
        }
      });

      document.addEventListener("input", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement)) {
          return;
        }
        const field = input.dataset.field;
        const checklistId = input.dataset.checklist;
        if (!field || !checklistId) {
          return;
        }
        updateChecklistLocal(checklistId, (item) => {
          if (field === "title") {
            item.title = input.value;
            return;
          }
          if (field === "summary") {
            item.summary = input.value;
            return;
          }
          if (field === "section-title") {
            const section = findSection(item, input.dataset.section);
            if (section) {
              section.title = input.value;
            }
            return;
          }
          if (field === "task-title") {
            const section = findSection(item, input.dataset.section);
            const task = (section?.tasks || []).find((entry) => entry.id === input.dataset.task);
            if (task) {
              task.title = input.value;
            }
          }
        });
      });

      document.addEventListener("focusout", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement)) {
          return;
        }
        if (!input.dataset.field || !input.dataset.checklist) {
          return;
        }
        if (pendingFocus) {
          debugLog("focusout.skipPendingFocus", {
            checklistId: input.dataset.checklist,
            field: input.dataset.field,
            sectionId: input.dataset.section || "",
            taskId: input.dataset.task || ""
          });
          return;
        }
        queueSave(input.dataset.checklist);
      });

      document.addEventListener("keydown", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement)) {
          return;
        }
        const checklistId = input.dataset.checklist;
        const field = input.dataset.field;
        if (!checklistId || !field) {
          return;
        }
        if (event.key === "Backspace" && field === "task-title" && input.dataset.section && input.dataset.task && input.value === "") {
          debugLog("task.delete.backspace", {
            checklistId,
            sectionId: input.dataset.section,
            taskId: input.dataset.task
          });
          event.preventDefault();
          deleteTask(checklistId, input.dataset.section, input.dataset.task);
          return;
        }
        if (event.key !== "Enter" || event.shiftKey) {
          return;
        }
        if (field === "task-title" && input.dataset.section && input.dataset.task) {
          debugLog("task.enter", {
            checklistId,
            sectionId: input.dataset.section,
            taskId: input.dataset.task,
            value: input.value,
            activeElementMatches: document.activeElement === input
          });
          event.preventDefault();
          insertTaskAfter(checklistId, input.dataset.section, input.dataset.task);
          return;
        }
        if (field === "section-title" && input.dataset.section) {
          event.preventDefault();
          appendTask(checklistId, input.dataset.section);
          return;
        }
      });

      document.addEventListener("change", async (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.type !== "checkbox" || !input.dataset.task) {
          return;
        }
        try {
          debugLog("task.toggle", {
            checklistId: input.dataset.checklist,
            sectionId: input.dataset.section,
            taskId: input.dataset.task,
            checked: Boolean(input.checked)
          });
          updateChecklistLocal(input.dataset.checklist, (item) => {
            const section = findSection(item, input.dataset.section);
            const task = (section?.tasks || []).find((entry) => entry.id === input.dataset.task);
            if (task) {
              task.checked = Boolean(input.checked);
            }
          });
          renderBoard();
          await queueSave(input.dataset.checklist);
        } catch (error) {
          await scheduleReload();
          document.getElementById("error").textContent = error.message;
        }
      });

      document.addEventListener("click", async (event) => {
        const addSectionButton = event.target.closest("[data-add-section]");
        if (addSectionButton) {
          appendSection(addSectionButton.dataset.addSection);
          return;
        }
        const removeTaskButton = event.target.closest("[data-remove-task]");
        if (removeTaskButton) {
          deleteTask(removeTaskButton.dataset.checklist, removeTaskButton.dataset.section, removeTaskButton.dataset.task);
          return;
        }
        const button = event.target.closest("[data-delete]");
        if (!button) {
          return;
        }
        try {
          await api({ action: "delete", id: button.dataset.delete });
          await scheduleReload();
        } catch (error) {
          document.getElementById("error").textContent = error.message;
        }
      });

      document.addEventListener("pointerdown", (event) => {
        if (event.target.dataset.resize) {
          handleResizeStart(event);
        }
      });

      window.addEventListener("resize", () => {
        applyBoardMasonryLayout();
        scheduleReload();
      });

      connectAppEvents();
      scheduleReload();
    </script>
  </body>
</html>
