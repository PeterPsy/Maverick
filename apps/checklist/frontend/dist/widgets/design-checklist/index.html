<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design checklist</title>
    <style>
      :root {
        font-family: Inter, "Sohne", "Avenir Next", "Segoe UI", sans-serif;
        color-scheme: dark;
        --maverick-text: #ececec;
        --maverick-text-muted: rgba(236, 236, 236, 0.64);
        --maverick-text-soft: rgba(236, 236, 236, 0.42);
        --maverick-focus: rgba(215, 36, 81, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--maverick-text);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.22);
        border: 2px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .checklist-eyebrow,
      .checklist-checklist-card__title,
      .checklist-checklist-card__hint,
      .checklist-checklist-section__title {
        margin: 0;
      }

      .checklist-eyebrow {
        color: var(--maverick-text-soft);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .widget-shell {
        padding: 2px;
      }

      .checklist-checklist-card {
        display: grid;
        grid-template-rows: auto auto auto;
        gap: 0.8rem;
        min-width: 260px;
        padding: 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 22px;
        background:
          radial-gradient(circle at 100% 0%, rgba(215, 36, 81, 0.1), transparent 28%),
          radial-gradient(circle at 0% 100%, rgba(167, 139, 250, 0.06), transparent 24%),
          linear-gradient(180deg, rgba(42, 42, 42, 0.92), rgba(28, 28, 28, 0.96));
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
      }

      .checklist-checklist-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .checklist-checklist-card__header-copy {
        display: grid;
        gap: 0.18rem;
        min-width: 0;
        flex: 1 1 auto;
      }

      .checklist-checklist-card__header-actions {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .checklist-checklist-icon-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.9rem;
        height: 1.9rem;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        color: rgba(236, 236, 236, 0.76);
        cursor: pointer;
        transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .checklist-checklist-icon-action:hover:not(:disabled) {
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: #ffffff;
      }

      .checklist-checklist-icon-action svg {
        width: 0.95rem;
        height: 0.95rem;
        stroke: currentColor;
      }

      .checklist-checklist-card__title {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .checklist-checklist-card__count {
        color: rgba(236, 236, 236, 0.42);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .checklist-checklist-card__body {
        min-height: 0;
        max-height: 420px;
        overflow: auto;
        padding-right: 0.2rem;
      }

      .checklist-checklist-card__sections {
        display: grid;
        gap: 0.9rem;
      }

      .checklist-checklist-section {
        display: grid;
        gap: 0.35rem;
      }

      .checklist-checklist-section__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.55rem;
      }

      .checklist-checklist-section__title {
        display: block;
        color: rgba(236, 236, 236, 0.76);
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.45;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .checklist-checklist-card__rows {
        display: grid;
        gap: 0.2rem;
      }

      .checklist-checklist-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: start;
        gap: 0.65rem;
        min-height: 2.2rem;
        padding: 0.34rem 0.2rem;
        border-radius: 14px;
        transition:
          background 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .checklist-checklist-row:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .checklist-checklist-row:focus-within {
        background: rgba(255, 255, 255, 0.03);
      }

      .checklist-checklist-row__checkbox {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        width: 1.05rem;
        height: 1.05rem;
        margin: 0.16rem 0 0;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.08),
          0 0 0 0 rgba(215, 36, 81, 0);
        cursor: pointer;
        transition:
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      .checklist-checklist-row__checkbox:hover:not(:disabled) {
        border-color: rgba(215, 36, 81, 0.48);
      }

      .checklist-checklist-row__checkbox:focus-visible {
        outline: none;
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.08),
          0 0 0 4px var(--maverick-focus);
      }

      .checklist-checklist-row__checkbox::after {
        content: "";
        position: absolute;
        inset: 0.2rem;
        border-radius: 999px;
        background: linear-gradient(180deg, #f84b78, #d72451);
        transform: scale(0.4);
        opacity: 0;
        transition:
          transform 180ms ease,
          opacity 180ms ease;
      }

      .checklist-checklist-row__checkbox:checked {
        border-color: rgba(215, 36, 81, 0.52);
        background: rgba(215, 36, 81, 0.08);
      }

      .checklist-checklist-row__checkbox:checked::after {
        transform: scale(1);
        opacity: 1;
      }

      .checklist-checklist-row__checkbox:disabled {
        cursor: default;
        opacity: 0.42;
      }

      .checklist-checklist-row__input {
        display: block;
        width: 100%;
        min-width: 0;
        color: var(--maverick-text);
        font-size: 0.92rem;
        line-height: 1.45;
        letter-spacing: -0.01em;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      .checklist-editor-input {
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
      }

      .checklist-editor-input::placeholder {
        color: var(--maverick-text-soft);
      }

      .checklist-editor-input:focus-visible {
        outline: none;
      }

      .checklist-checklist-card__title-input {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .checklist-checklist-section__input {
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.45;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .checklist-checklist-row__text {
        display: block;
        width: 100%;
        min-width: 0;
      }

      .checklist-checklist-row.is-checked .checklist-checklist-row__input {
        color: rgba(236, 236, 236, 0.5);
        text-decoration: line-through;
        text-decoration-thickness: 1px;
        text-decoration-color: rgba(215, 36, 81, 0.5);
      }

      .checklist-checklist-row__delete {
        width: 1.4rem;
        height: 1.4rem;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(236, 236, 236, 0.26);
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 180ms ease,
          color 180ms ease,
          background 180ms ease;
      }

      .checklist-checklist-row:hover .checklist-checklist-row__delete,
      .checklist-checklist-row:focus-within .checklist-checklist-row__delete {
        opacity: 1;
        pointer-events: auto;
      }

      .checklist-checklist-row__delete:hover {
        background: rgba(255, 255, 255, 0.04);
        color: rgba(236, 236, 236, 0.72);
      }

      .checklist-checklist-card__footer {
        display: grid;
        gap: 0.35rem;
      }

      .checklist-checklist-card__hint {
        color: rgba(236, 236, 236, 0.42);
        font-size: 0.72rem;
      }

      .checklist-checklist-card__hint-input {
        color: rgba(236, 236, 236, 0.7);
        font-size: 0.72rem;
      }

      .widget-error {
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(24, 24, 24, 0.96);
        color: #ffb3cf;
        font-size: 0.86rem;
        line-height: 1.5;
      }

      @media (max-width: 640px) {
        .widget-shell {
          padding: 0;
        }

        .checklist-checklist-card {
          gap: 0.7rem;
          min-width: 0;
          padding: 0.82rem;
          border-radius: 18px;
        }

        .checklist-checklist-card__header {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          align-items: start;
          gap: 0.5rem;
        }

        .checklist-checklist-card__header-actions {
          justify-content: space-between;
          gap: 0.5rem;
        }

        .checklist-checklist-card__title {
          font-size: 0.96rem;
        }

        .checklist-checklist-card__count,
        .checklist-checklist-card__hint,
        .checklist-checklist-section__title {
          font-size: 0.68rem;
        }

        .checklist-checklist-row {
          gap: 0.5rem;
          min-height: 2.5rem;
          padding: 0.32rem 0;
        }

        .checklist-checklist-row__checkbox {
          width: 1.15rem;
          height: 1.15rem;
        }

        .checklist-checklist-row__input {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="widget-shell">
      <main id="root" class="widget-error">Loading checklist...</main>
    </div>
    <script>
      const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
      const token = new URLSearchParams(hash).get("context") || new URLSearchParams(window.location.search).get("context") || "";
      const APP_ID = "checklist";
      const WIDGET_ID = "design-checklist";
      const APP_EVENTS_WS_PATH = "/api/apps/events/ws";
      let checklistId = "";
      let state = { title: "Checklist", summary: "", sections: [] };
      let activeRefreshPromise = null;
      let pendingRefresh = false;
      let localVersion = 0;
      let saveChain = Promise.resolve();
      let pendingFocus = null;

      const esc = (value) =>
        String(value ?? "").replace(/[&<>\"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        }[char]));

      const flatten = () => state.sections.flatMap((section) => section.tasks || []);

      const nextTempId = (prefix) => `${prefix}-${Math.random().toString(16).slice(2, 10)}`;

      const debugLog = (event, details = {}) => {
        console.debug("[checklist-widget]", event, {
          ts: new Date().toISOString(),
          ...details
        });
      };

      const reportWidgetSize = () => {
        const root = document.getElementById("root");
        if (!root) {
          return;
        }
        const height = Math.ceil(root.getBoundingClientRect().height + 4);
        window.parent?.postMessage(
          {
            type: "maverick.widget.resize",
            owner_app_id: APP_ID,
            widget_id: WIDGET_ID,
            height: `${height}px`
          },
          window.location.origin
        );
      };

      const applyPendingFocus = () => {
        if (!pendingFocus) {
          return;
        }
        const selector = pendingFocus.field === "task-title"
          ? `[data-field="task-title"][data-section="${pendingFocus.sectionId}"][data-task="${pendingFocus.taskId}"]`
          : pendingFocus.field === "section-title"
            ? `[data-field="section-title"][data-section="${pendingFocus.sectionId}"]`
            : `[data-field="${pendingFocus.field}"]`;
        const target = document.querySelector(selector);
        if (!(target instanceof HTMLInputElement)) {
          debugLog("focus.miss", { selector, pendingFocus });
          return;
        }
        const focusDescriptor = pendingFocus;
        window.requestAnimationFrame(() => {
          debugLog("focus.apply", {
            field: focusDescriptor.field,
            sectionId: focusDescriptor.sectionId,
            taskId: focusDescriptor.taskId,
            targetValue: target.value
          });
          target.focus();
          if (focusDescriptor.selectAll) {
            target.select();
          }
        });
        focusDescriptor.rendersRemaining -= 1;
        if (focusDescriptor.rendersRemaining <= 0) {
          pendingFocus = null;
        }
      };

      const sanitizeSections = (sections) => {
        const normalized = (Array.isArray(sections) ? sections : []).map((section, sectionIndex) => ({
          id: String(section.id || `section-${sectionIndex + 1}`),
          title: String(section.title || ""),
          tasks: (Array.isArray(section.tasks) ? section.tasks : [])
            .map((task, taskIndex) => ({
              id: String(task.id || `task-${sectionIndex + 1}-${taskIndex + 1}`),
              title: String(task.title || "").trim(),
              checked: Boolean(task.checked)
            }))
        }));
        return normalized.length ? normalized : [{ id: "section-default", title: "", tasks: [] }];
      };

      const countTasks = () => {
        const tasks = flatten();
        return { checked: tasks.filter((task) => task.checked).length, total: tasks.length };
      };

      const queueSave = () => {
        if (!checklistId) {
          return Promise.resolve();
        }
        const version = localVersion;
        if (version === 0) {
          return Promise.resolve();
        }
        const snapshot = {
          title: String(state.title || "").trim() || "Checklist",
          summary: String(state.summary || "").trim(),
          sections: sanitizeSections(state.sections)
        };
        debugLog("save.queue", {
          checklistId,
          version,
          sections: snapshot.sections?.length || 0,
          taskCount: flatten().length,
          pendingFocus
        });
        saveChain = saveChain
          .catch(() => {})
          .then(async () => {
            debugLog("save.start", { checklistId, version });
            const result = await backend({
              action: "update",
              id: checklistId,
              payload: snapshot
            });
            if (version === localVersion) {
              const nextChecklist = result.checklist && typeof result.checklist === "object" ? result.checklist : null;
              if (nextChecklist) {
                debugLog("save.success", { checklistId, version, pendingFocus });
                normalizeChecklistRecord(nextChecklist);
                localVersion = 0;
                render("Checklist saved.");
                return;
              }
              const next = result.chat_render && result.chat_render.payload ? result.chat_render.payload : null;
              if (next) {
                debugLog("save.success", { checklistId, version, pendingFocus });
                normalizePayload({ memory: { checklist_id: checklistId }, payload: next });
                localVersion = 0;
                render("Checklist saved.");
              }
            }
          })
          .catch((error) => {
            debugLog("save.error", { checklistId, version, message: error.message });
            const root = document.getElementById("root");
            root.className = "widget-error";
            root.textContent = error.message;
          });
        return saveChain;
      };

      const findSection = (sectionId) => (state.sections || []).find((section) => section.id === sectionId) || null;

      const deleteTask = (sectionId, taskId) => {
        let focusTarget = null;
        state.sections = state.sections.map((section) => {
          if (section.id !== sectionId) {
            return section;
          }
          const tasks = Array.isArray(section.tasks) ? [...section.tasks] : [];
          const index = tasks.findIndex((task) => task.id === taskId);
          if (index < 0) {
            return section;
          }
          const neighbor = tasks[index - 1] || tasks[index + 1] || null;
          tasks.splice(index, 1);
          if (neighbor) {
            focusTarget = { field: "task-title", sectionId, taskId: neighbor.id, cursorAtEnd: true };
          } else {
            focusTarget = { field: "section-title", sectionId, cursorAtEnd: true };
          }
          return { ...section, tasks };
        });
        localVersion += 1;
        pendingFocus = focusTarget;
        render("Checklist saved.");
        queueSave();
      };

      const render = (message = "") => {
        const tasks = flatten();
        const checked = tasks.filter((task) => task.checked).length;
        debugLog("render.widget", {
          checklistId,
          tasks: tasks.length,
          activeElement:
            document.activeElement instanceof HTMLInputElement
              ? {
                  field: document.activeElement.dataset.field || "",
                  sectionId: document.activeElement.dataset.section || "",
                  taskId: document.activeElement.dataset.task || "",
                  value: document.activeElement.value
                }
              : null,
          pendingFocus,
          message
        });
        document.getElementById("root").className = "";
        document.getElementById("root").innerHTML = `
          <article class="checklist-checklist-card">
            <div class="checklist-checklist-card__header">
              <div class="checklist-checklist-card__header-copy">
                <p class="checklist-eyebrow">Checklist</p>
                <input class="checklist-editor-input checklist-checklist-card__title checklist-checklist-card__title-input" data-field="title" value="${esc(state.title)}" ${checklistId ? "" : "disabled"}>
              </div>
              <div class="checklist-checklist-card__header-actions">
                <span class="checklist-checklist-card__count">${checked}/${tasks.length}</span>
                <button aria-label="New section" class="checklist-checklist-icon-action" data-add-section="true" type="button" ${checklistId ? "" : "disabled"}>
                  <svg fill="none" viewBox="0 0 24 24">
                    <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="checklist-checklist-card__body">
              <div class="checklist-checklist-card__sections">
                ${state.sections.map((section) => `
                  <section class="checklist-checklist-section">
                    <div class="checklist-checklist-section__header">
                      <input class="checklist-editor-input checklist-checklist-section__title checklist-checklist-section__input" data-field="section-title" data-section="${esc(section.id)}" placeholder="New section" value="${esc(section.title || "")}" ${checklistId ? "" : "disabled"}>
                    </div>
                    <div class="checklist-checklist-card__rows">
                      ${(section.tasks || []).map((task) => `
                        <div class="checklist-checklist-row ${task.checked ? "is-checked" : ""}">
                          <input
                            class="checklist-checklist-row__checkbox"
                            type="checkbox"
                            ${task.checked ? "checked" : ""}
                            data-section="${esc(section.id)}"
                            data-task="${esc(task.id)}"
                            ${checklistId ? "" : "disabled"}>
                          <span class="checklist-checklist-row__text">
                            <input class="checklist-editor-input checklist-checklist-row__input" data-field="task-title" data-section="${esc(section.id)}" data-task="${esc(task.id)}" placeholder="New task" value="${esc(task.title)}" ${checklistId ? "" : "disabled"}>
                          </span>
                          <button aria-label="Delete task" class="checklist-checklist-row__delete" data-remove-task="true" data-section="${esc(section.id)}" data-task="${esc(task.id)}" type="button" ${checklistId ? "" : "disabled"}>×</button>
                        </div>
                      `).join("")}
                    </div>
                  </section>
                `).join("")}
              </div>
            </div>
            <div class="checklist-checklist-card__footer">
              <input class="checklist-editor-input checklist-checklist-card__hint checklist-checklist-card__hint-input" data-field="summary" placeholder="Add a summary" value="${esc(state.summary || "")}" ${checklistId ? "" : "disabled"}>
              <p class="checklist-checklist-card__hint">${esc(message || (checklistId ? "Saved in Checklist." : "Checklist preview."))}</p>
            </div>
          </article>`;
        applyPendingFocus();
        window.requestAnimationFrame(reportWidgetSize);
      };

      const loadContext = async () => {
        if (!token) {
          throw new Error("Missing widget context.");
        }
        const response = await fetch(`/api/apps/widgets/context/${encodeURIComponent(token)}`, {
          credentials: "same-origin",
          headers: { Accept: "application/json" }
        });
        if (!response.ok) {
          throw new Error("Unable to load widget context.");
        }
        return (await response.json()).context || {};
      };

      const backend = async (body) => {
        const response = await fetch("/api/apps/checklist/backend", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok || data.error) {
          throw new Error(data.detail || data.error || "Unable to save checklist.");
        }
        return data;
      };

      const normalizePayload = (content) => {
        const payload = content && typeof content.payload === "object" ? content.payload : {};
        const memory = content && typeof content.memory === "object" ? content.memory : {};
        checklistId =
          typeof payload.id === "string" && payload.id
            ? payload.id
            : typeof payload.checklist_id === "string" && payload.checklist_id
              ? payload.checklist_id
              : typeof memory.checklist_id === "string"
                ? memory.checklist_id
                : "";
        state = {
          title: String(payload.title || "Checklist"),
          summary: String(payload.summary || ""),
          sections: Array.isArray(payload.sections) ? payload.sections : [{ id: "section-default", title: "", tasks: [] }]
        };
      };

      const normalizeChecklistRecord = (item) => {
        state = {
          title: String(item.title || "Checklist"),
          summary: String(item.summary || ""),
          sections: Array.isArray(item.sections) ? item.sections : [{ id: "section-default", title: "", tasks: [] }]
        };
      };

      const refreshState = async () => {
        debugLog("refresh.start", { checklistId });
        if (checklistId) {
          const result = await backend({ action: "read", id: checklistId });
          normalizeChecklistRecord(result.checklist || {});
          debugLog("refresh.success", { checklistId, mode: "read" });
          render("Checklist updated.");
          return;
        }
        const context = await loadContext();
        normalizePayload(context.content || {});
        if (checklistId) {
          const result = await backend({ action: "read", id: checklistId });
          normalizeChecklistRecord(result.checklist || {});
          debugLog("refresh.success", { checklistId, mode: "context-read" });
          render("Checklist updated.");
          return;
        }
        debugLog("refresh.success", { checklistId, mode: "context" });
        render();
      };

      const scheduleRefresh = () => {
        debugLog("refresh.schedule", {
          activeRefresh: Boolean(activeRefreshPromise),
          pendingRefresh
        });
        if (activeRefreshPromise) {
          pendingRefresh = true;
          return activeRefreshPromise;
        }
        activeRefreshPromise = refreshState()
          .catch((error) => {
            const root = document.getElementById("root");
            root.className = "widget-error";
            root.textContent = error.message;
          })
          .finally(() => {
            activeRefreshPromise = null;
            if (pendingRefresh) {
              pendingRefresh = false;
              scheduleRefresh();
            }
          });
        return activeRefreshPromise;
      };

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || !event.data || typeof event.data !== "object") {
          return;
        }
        const payload = event.data;
        const isWidgetEvent = payload.type === "maverick.widget.data-changed";
        const isAppEvent = payload.type === "maverick.app.data-changed";
        if (!isWidgetEvent && !isAppEvent) {
          return;
        }
        debugLog("event.dataChanged", payload);
        if (payload.owner_app_id && payload.owner_app_id !== APP_ID) {
          return;
        }
        if (payload.resource && payload.resource !== "state") {
          return;
        }
        scheduleRefresh();
      });

      if (typeof WebSocket !== "undefined") {
        let socket = null;
        let reconnectTimer = 0;
        let closed = false;

        const connect = () => {
          const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
          socket = new WebSocket(`${protocol}//${window.location.host}${APP_EVENTS_WS_PATH}`);
          socket.onmessage = (message) => {
            try {
              const payload = JSON.parse(message.data);
              if (!payload || payload.type !== "maverick.app.data-changed") {
                return;
              }
              if (payload.owner_app_id && payload.owner_app_id !== APP_ID) {
                return;
              }
              if (payload.resource && payload.resource !== "state") {
                return;
              }
              debugLog("event.dataChanged", payload);
              scheduleRefresh();
            } catch {
              return;
            }
          };
          socket.onclose = () => {
            if (!closed) {
              reconnectTimer = window.setTimeout(connect, 1000);
            }
          };
          socket.onerror = () => {
            socket.close();
          };
        };

        connect();
        window.addEventListener("beforeunload", () => {
          closed = true;
          if (reconnectTimer) {
            window.clearTimeout(reconnectTimer);
          }
          if (socket) {
            socket.close();
          }
        }, { once: true });
      }

      document.addEventListener("input", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || !input.dataset.field || !checklistId) {
          return;
        }
        localVersion += 1;
        if (input.dataset.field === "title") {
          state.title = input.value;
          return;
        }
        if (input.dataset.field === "summary") {
          state.summary = input.value;
          return;
        }
        if (input.dataset.field === "section-title") {
          const section = findSection(input.dataset.section);
          if (section) {
            section.title = input.value;
          }
          return;
        }
        if (input.dataset.field === "task-title") {
          const section = findSection(input.dataset.section);
          const task = (section?.tasks || []).find((entry) => entry.id === input.dataset.task);
          if (task) {
            task.title = input.value;
          }
        }
      });

      document.addEventListener("focusout", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || !input.dataset.field || !checklistId) {
          return;
        }
        if (pendingFocus) {
          debugLog("focusout.skipPendingFocus", {
            checklistId,
            field: input.dataset.field,
            sectionId: input.dataset.section || "",
            taskId: input.dataset.task || ""
          });
          return;
        }
        queueSave();
      });

      document.addEventListener("keydown", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || !checklistId) {
          return;
        }
        if (event.key === "Backspace" && input.dataset.field === "task-title" && input.dataset.section && input.dataset.task && input.value === "") {
          debugLog("task.delete.backspace", {
            checklistId,
            sectionId: input.dataset.section,
            taskId: input.dataset.task
          });
          event.preventDefault();
          deleteTask(input.dataset.section, input.dataset.task);
          return;
        }
        if (event.key !== "Enter" || event.shiftKey) {
          return;
        }
        if (input.dataset.field === "task-title" && input.dataset.section && input.dataset.task) {
          debugLog("task.enter", {
            checklistId,
            sectionId: input.dataset.section,
            taskId: input.dataset.task,
            value: input.value,
            activeElementMatches: document.activeElement === input
          });
          event.preventDefault();
          const section = findSection(input.dataset.section);
          if (!section) {
            return;
          }
          const nextTask = { id: nextTempId("task"), title: "", checked: false };
          const tasks = Array.isArray(section.tasks) ? section.tasks : [];
          const index = Math.max(0, tasks.findIndex((task) => task.id === input.dataset.task));
          tasks.splice(index + 1, 0, nextTask);
          section.tasks = tasks;
          localVersion += 1;
          pendingFocus = { field: "task-title", sectionId: section.id, taskId: nextTask.id, selectAll: true, rendersRemaining: 6 };
          render("Checklist saved.");
          queueSave();
          return;
        }
        if (input.dataset.field === "section-title" && input.dataset.section) {
          event.preventDefault();
          const section = findSection(input.dataset.section);
          if (!section) {
            return;
          }
          const nextTask = { id: nextTempId("task"), title: "", checked: false };
          section.tasks = [...(section.tasks || []), nextTask];
          localVersion += 1;
          pendingFocus = { field: "task-title", sectionId: section.id, taskId: nextTask.id, selectAll: true, rendersRemaining: 6 };
          render("Checklist saved.");
          queueSave();
        }
      });

      document.addEventListener("change", async (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.type !== "checkbox" || !input.dataset.task || !checklistId) {
          return;
        }

        debugLog("task.toggle", {
          checklistId,
          sectionId: input.dataset.section,
          taskId: input.dataset.task,
          checked: Boolean(input.checked)
        });
        localVersion += 1;
        state.sections = state.sections.map((section) =>
          section.id === input.dataset.section
            ? {
                ...section,
                tasks: (section.tasks || []).map((task) =>
                  task.id === input.dataset.task ? { ...task, checked: input.checked } : task
                )
              }
            : section
        );

        render("Saving...");
        try {
          const result = await backend({
            action: "update",
            id: checklistId,
            payload: {
              sections: state.sections,
              summary: state.summary
            }
          });
          const next = result.chat_render && result.chat_render.payload ? result.chat_render.payload : null;
          if (next) {
            normalizePayload({ memory: { checklist_id: checklistId }, payload: next });
          }
          render("Checklist saved.");
        } catch (error) {
          input.checked = !input.checked;
          render(error.message);
        }
      });

      document.addEventListener("click", (event) => {
        const addSection = event.target.closest("[data-add-section]");
        if (addSection && checklistId) {
          const sectionId = nextTempId("section");
          state.sections = [
            ...(state.sections || []),
            {
              id: sectionId,
              title: "New section",
              tasks: [{ id: nextTempId("task"), title: "", checked: false }]
            }
          ];
          localVersion += 1;
          pendingFocus = { field: "section-title", sectionId, selectAll: true };
          render("Checklist saved.");
          queueSave();
          return;
        }
        const removeTask = event.target.closest("[data-remove-task]");
        if (removeTask && checklistId) {
          deleteTask(removeTask.dataset.section, removeTask.dataset.task);
        }
      });

      window.addEventListener("resize", reportWidgetSize);
      if (typeof ResizeObserver !== "undefined") {
        const resizeObserver = new ResizeObserver(() => reportWidgetSize());
        resizeObserver.observe(document.body);
        resizeObserver.observe(document.documentElement);
      }

      scheduleRefresh();
    </script>
  </body>
</html>
