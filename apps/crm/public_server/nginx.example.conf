# Exact host only. Existing apps.<installation-domain> HTTP-01 ingress stays intact.
limit_req_zone $binary_remote_addr zone=crm_public_requests:1m rate=10r/s;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.apps.{{INSTALLATION_DOMAIN}};
    ssl_certificate /var/lib/maverick/crm-public-tls/config/live/crm-public/fullchain.pem;
    ssl_certificate_key /var/lib/maverick/crm-public-tls/config/live/crm-public/privkey.pem;
    access_log off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    location / {
        limit_req zone=crm_public_requests burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/maverick-crm-public-listener/public.sock;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
    }
}
