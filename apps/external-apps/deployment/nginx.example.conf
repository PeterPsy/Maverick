# Operator-reviewed public virtual hosts; safe to add beside existing hosts.
# Replace domain/certificate paths. The certificate must cover both the base
# domain and its wildcard. Never add private ASGI/error-page fallback routes.
# Deliberately no default_server: do not take over an existing shared ingress.
upstream external_apps_public {
    server unix:/run/maverick-external-apps-listener/public.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name apps.example.com *.apps.example.com;
    access_log off;
    return 444;  # HTTPS only; no inherited error page or HTTP-01 challenge.
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apps.example.com *.apps.example.com;
    ssl_certificate /etc/ssl/external-apps/fullchain.pem;
    ssl_certificate_key /etc/ssl/external-apps/privkey.pem;
    client_max_body_size 1k;
    gzip off;
    access_log off;
    # Override inherited private error handlers and never serve a stale fallback.
    error_page 500 502 503 504 =503 @external_apps_unavailable;

    location / {
        limit_except GET { deny all; }  # GET also permits HEAD in nginx.
        proxy_pass http://external_apps_public;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
    }

    location @external_apps_unavailable {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "Public hosting unavailable\n";
    }
}
