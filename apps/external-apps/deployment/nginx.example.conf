# Operator-reviewed template for a DEDICATED public ingress; not auto-installed.
# Replace domain/certificate paths. Never merge this wildcard with private ASGI
# fallback routes. Maverick session cookies must be host-only on its own origin.
upstream external_apps_public {
    server unix:/run/maverick-external-apps-listener/public.sock;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name *.apps.example.com;
    ssl_certificate /etc/ssl/external-apps/fullchain.pem;
    ssl_certificate_key /etc/ssl/external-apps/privkey.pem;
    client_max_body_size 1k;
    gzip off;
    access_log off;

    location / {
        limit_except GET { deny all; }  # GET also permits HEAD in nginx.
        proxy_pass http://external_apps_public;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_cache off;
        proxy_buffering on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
    }
}
