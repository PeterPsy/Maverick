# Render PUBLIC_DOMAIN tokens from apps.<installation-domain> with tls_config.
# Dedicated namespace only: preserve all existing private/default virtual hosts.
upstream external_apps_public {
    server unix:/run/maverick-external-apps-listener/public.sock;
}
server {
    listen 80;
    listen [::]:80;
    server_name {{PUBLIC_DOMAIN}} *.{{PUBLIC_DOMAIN}};
    access_log off;
    error_page 404 =404 @external_apps_not_found;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/maverick/external-apps-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    location / { return 444; }
    location @external_apps_not_found { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.{{PUBLIC_DOMAIN}} ~^{{PUBLIC_DOMAIN_REGEX}}$;
    # Unknown/unprovisioned SNI cannot trigger ACME or reach private Maverick.
    ssl_reject_handshake on;
    return 404;
}
include /var/lib/maverick/external-apps-tls/hosts.conf;
