<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      @import url("https://tracker.example/import.css");
      @media only screen and (max-width: 600px) {
        .desktop { display: none !important; }
        .mobile { display: block !important; }
        .container { width: 100% !important; }
        .stack { display: block !important; width: 100% !important; }
      }
      .hero { background-image: url("https://tracker.example/hero.png"); color: #fff; }
      .preheader { display: none; max-height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div class="preheader">Hidden preheader</div>
    <table role="presentation" class="container" width="640" cellpadding="0" cellspacing="0" bgcolor="#ffffff">
      <tr>
        <td class="hero" id="hero-card" background="https://tracker.example/background.png" style="background:u\72l(https://tracker.example/style.png) #990000; color: red; padding: 24px;">
          <h1 style="font-family: Arial, Helvetica, sans-serif; font-size: 28px; line-height: 34px;">Hello <strong>HTML</strong></h1>
          <p class="desktop" style="color: #123456;">Desktop newsletter copy.</p>
          <p class="mobile" style="display: none; max-height: 0;">Mobile newsletter copy.</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td class="stack" width="50%" valign="top">First responsive column</td>
              <td class="stack" width="50%" valign="top">Second responsive column</td>
            </tr>
          </table>
          <a href="https://example.com/news" onclick="steal()">Open</a>
          <img src="https://tracker.example/pixel.png" alt="tracker" width="1" height="1" style="display:block;">
          <img src="cid:logo123" alt="logo" width="96" height="32">
          <script>steal()</script>
        </td>
      </tr>
    </table>
  </body>
</html>
