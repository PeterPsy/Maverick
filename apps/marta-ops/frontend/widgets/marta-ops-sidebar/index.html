<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      (function () {
        var search = new URLSearchParams(window.location.search);
        var hash = new URLSearchParams(window.location.hash.slice(1));
        var theme =
          search.get("loopino_theme") ||
          hash.get("loopino_theme") ||
          search.get("loopino_color_scheme") ||
          hash.get("loopino_color_scheme");
        var effective = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.loopinoTheme = effective;
        document.documentElement.dataset.theme = effective;
        document.documentElement.style.colorScheme = effective;
      })();
    </script>
    <title>Marta Ops Sidebar</title>
  </head>
  <body>
    <div id="marta-ops-sidebar-root"></div>
    <script
      type="module"
      src="/src/widgets/marta-ops-sidebar/main.tsx"
    ></script>
  </body>
</html>
