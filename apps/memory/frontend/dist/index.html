<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0e1114;
        color: #eef3f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0e1114; overflow: hidden; }
      main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; height: 100vh; }
      aside, section { border-right: 1px solid #26313a; padding: 18px; min-width: 0; }
      section:last-child { border-right: 0; border-left: 1px solid #26313a; }
      h1, h2 { margin: 0; font-size: 20px; line-height: 1.2; }
      h2 { font-size: 13px; color: #aab8bf; text-transform: uppercase; letter-spacing: .08em; }
      input, textarea, button, select {
        width: 100%;
        border: 1px solid #33414b;
        background: #151b20;
        color: #eef3f5;
        border-radius: 6px;
        padding: 10px 12px;
        font: inherit;
      }
      textarea { min-height: 118px; resize: vertical; }
      button { cursor: pointer; background: #d8f06e; color: #111; border: 0; font-weight: 800; }
      button.secondary { background: #1f2930; color: #dce7eb; border: 1px solid #34424d; }
      .stack { display: grid; gap: 12px; }
      .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .toolbar button { width: auto; min-width: 76px; }
      .custom-view-bar {
        display: grid;
        gap: 8px;
        border: 1px solid #46544b;
        background: #18211b;
        border-radius: 6px;
        padding: 12px;
      }
      .custom-view-bar[hidden] { display: none; }
      .custom-view-bar strong { color: #d8f06e; }
      .item {
        text-align: left;
        border: 1px solid #2e3a43;
        border-radius: 6px;
        padding: 12px;
        background: #141b20;
        color: #eef3f5;
      }
      .item strong { display: block; margin-bottom: 5px; }
      .item.active { border-color: #d8f06e; box-shadow: 0 0 0 1px #d8f06e inset; }
      .muted { color: #91a1aa; font-size: 13px; }
      .meta { display: flex; flex-wrap: wrap; gap: 8px; }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 9px;
        background: #202a31;
        color: #bdcbd1;
        font-size: 12px;
      }
      .swatch { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
      .graph-shell { position: relative; min-width: 0; height: 100vh; overflow: hidden; background: #0c1013; }
      canvas { width: 100%; height: 100%; display: block; cursor: grab; }
      canvas:active { cursor: grabbing; }
      .graph-topbar {
        position: absolute;
        inset: 16px 16px auto 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        pointer-events: none;
      }
      .graph-topbar > * { pointer-events: auto; }
      .stats {
        display: flex;
        gap: 8px;
        padding: 8px;
        border: 1px solid #2e3a43;
        background: rgba(14, 17, 20, .86);
        border-radius: 6px;
        backdrop-filter: blur(10px);
      }
      .legend {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: calc(100% - 32px);
        pointer-events: none;
      }
      .legend .pill { background: rgba(22, 29, 34, .88); border: 1px solid #2e3a43; }
      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #8ea0a8;
        pointer-events: none;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #0b0f12;
        border: 1px solid #27313a;
        border-radius: 6px;
        padding: 12px;
        max-height: 220px;
        overflow: auto;
      }
      .relationships { display: grid; gap: 8px; max-height: 210px; overflow: auto; }
      .rel {
        border: 1px solid #2d3941;
        border-radius: 6px;
        padding: 10px;
        background: #11171b;
      }
      @media (max-width: 1100px) {
        body { overflow: auto; }
        main { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
        aside, section { border-right: 0; border-bottom: 1px solid #26313a; }
        section:last-child { border-left: 0; }
        .graph-shell { height: 62vh; min-height: 460px; }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <div class="stack">
          <div>
            <h1>Memory</h1>
            <div class="muted">Workspace knowledge graph</div>
          </div>
          <div class="toolbar">
            <input id="query" placeholder="Search memory" />
            <button id="search">Search</button>
          </div>
          <button id="refresh" class="secondary">Refresh graph</button>
          <div id="custom-view-bar" class="custom-view-bar" hidden>
            <strong id="custom-view-title">Custom Memory view</strong>
            <div id="custom-view-copy" class="muted">Showing selected memory nodes.</div>
            <button id="clear-custom-view" class="secondary" type="button">Back to full memory</button>
          </div>
          <div class="stack">
            <h2>Matches</h2>
            <div id="results" class="stack"></div>
          </div>
          <div class="stack">
            <h2>Remember</h2>
            <input id="title" placeholder="Title" />
            <select id="node-type">
              <option value="note">Note</option>
              <option value="fact">Fact</option>
              <option value="decision">Decision</option>
              <option value="file_ref">File reference</option>
              <option value="app_entity_ref">App entity</option>
              <option value="person_ref">Person</option>
              <option value="company_ref">Company</option>
              <option value="project_ref">Project</option>
              <option value="topic">Topic</option>
              <option value="question">Question</option>
            </select>
            <textarea id="body" placeholder="Durable note, fact, decision, or context"></textarea>
            <button id="remember">Remember</button>
          </div>
        </div>
      </aside>
      <div class="graph-shell">
        <canvas id="graph"></canvas>
        <div class="graph-topbar">
          <div class="stats">
            <span class="pill" id="node-count">0 nodes</span>
            <span class="pill" id="edge-count">0 links</span>
          </div>
          <button id="fit" class="secondary">Fit</button>
        </div>
        <div id="empty" class="empty">No memory nodes yet</div>
        <div id="legend" class="legend"></div>
      </div>
      <section>
        <div class="stack">
          <div>
            <h2>Selected</h2>
            <pre id="selected">Select a node in the graph.</pre>
          </div>
          <div>
            <h2>Relationships</h2>
            <div id="relationships" class="relationships"></div>
          </div>
          <div>
            <h2>Context Preview</h2>
            <button id="context">Preview Context</button>
            <pre id="context-output">Run a query to preview agent context.</pre>
          </div>
        </div>
      </section>
    </main>
    <script>
      const canvas = document.getElementById('graph');
      const ctx = canvas.getContext('2d');
      const state = {
        nodes: [],
        edges: [],
        selectedId: null,
        hoverId: null,
        query: '',
        viewFilter: null,
        scale: 1,
        offsetX: 0,
        offsetY: 0,
        dragging: null,
        panning: false,
        lastX: 0,
        lastY: 0,
        firstHydration: true,
        appSocket: null,
        appSocketReconnectTimer: null,
        appSocketRetry: 0,
        exitingNodes: [],
        exitingEdges: [],
        animation: null
      };
      const NODE_ANIMATION_MS = 900;
      const EDGE_ANIMATION_MS = 1100;
      const EXIT_ANIMATION_MS = 700;
      const colors = {
        note: '#d8f06e',
        fact: '#67d5ff',
        decision: '#ffce73',
        file_ref: '#a68cff',
        app_entity_ref: '#ff8da1',
        person_ref: '#7cf0c6',
        company_ref: '#f4a261',
        project_ref: '#8fd3ff',
        topic: '#b8f48f',
        question: '#f497d1'
      };
      async function callMemory(body) {
        const response = await fetch('/api/apps/memory/backend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const payload = await response.json();
        return payload.json || payload;
      }
      function normalizeViewFilter(raw) {
        return {
          mode: raw?.mode === 'custom' ? 'custom' : 'search',
          title: raw?.title || '',
          query: raw?.query || '',
          refs: Array.isArray(raw?.refs) ? raw.refs : [],
          updated_at: raw?.updated_at || ''
        };
      }
      function applyViewFilter(viewFilter) {
        state.viewFilter = normalizeViewFilter(viewFilter);
        const queryInput = document.getElementById('query');
        if (queryInput.value !== state.viewFilter.query) queryInput.value = state.viewFilter.query;
        renderCustomViewBar();
      }
      async function loadViewFilter() {
        const payload = await callMemory({ action: 'view_filter' });
        applyViewFilter(payload.state?.view_filter);
      }
      function renderCustomViewBar() {
        const bar = document.getElementById('custom-view-bar');
        const isCustom = state.viewFilter?.mode === 'custom';
        bar.hidden = !isCustom;
        if (!isCustom) return;
        document.getElementById('custom-view-title').textContent = state.viewFilter.title || 'Custom Memory view';
        document.getElementById('custom-view-copy').textContent = `Showing ${state.viewFilter.refs.length} selected memory node${state.viewFilter.refs.length === 1 ? '' : 's'}.`;
      }
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * ratio));
        canvas.height = Math.max(1, Math.floor(rect.height * ratio));
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }
      function graphCenter() {
        const rect = canvas.getBoundingClientRect();
        return { x: rect.width / 2, y: rect.height / 2 };
      }
      function edgeKey(edge) {
        return edge.id || `${edge.source}->${edge.target}:${edge.kind}`;
      }
      function hydrateGraph(payload) {
        const center = graphCenter();
        const now = performance.now();
        const existing = new Map(state.nodes.map((node) => [node.id, node]));
        const exitingById = new Map(state.exitingNodes.map((node) => [node.id, node]));
        const nextNodeIds = new Set((payload.nodes || []).map((node) => node.id));
        const newlyExitingNodes = state.firstHydration ? [] : state.nodes
          .filter((node) => !nextNodeIds.has(node.id))
          .map((node) => ({ ...node, disappearingAt: now, vx: 0, vy: 0 }));
        const exitingNodeIds = new Set();
        state.exitingNodes = [
          ...state.exitingNodes.filter((node) => !nextNodeIds.has(node.id) && now - (node.disappearingAt || now) < EXIT_ANIMATION_MS),
          ...newlyExitingNodes
        ].filter((node) => {
          if (exitingNodeIds.has(node.id)) return false;
          exitingNodeIds.add(node.id);
          return true;
        });
        state.nodes = (payload.nodes || []).map((node, index, all) => {
          const cached = existing.get(node.id);
          const exiting = exitingById.get(node.id);
          const angle = (index / Math.max(1, all.length)) * Math.PI * 2;
          const radius = 90 + Math.min(260, all.length * 10);
          return {
            ...node,
            x: cached?.x ?? exiting?.x ?? center.x + Math.cos(angle) * radius,
            y: cached?.y ?? exiting?.y ?? center.y + Math.sin(angle) * radius,
            vx: cached?.vx ?? 0,
            vy: cached?.vy ?? 0,
            radius: 12 + Math.min(12, Number(node.importance || 0.5) * 14),
            appearedAt: cached?.appearedAt ?? (state.firstHydration ? 0 : now)
          };
        });
        const nextEdgeKeys = new Set((payload.edges || []).map(edgeKey));
        const existingEdges = new Set(state.edges.map(edgeKey));
        const newlyExitingEdges = state.firstHydration ? [] : state.edges
          .filter((edge) => !nextEdgeKeys.has(edgeKey(edge)))
          .map((edge) => ({ ...edge, disappearingAt: now }));
        state.edges = (payload.edges || []).map((edge) => {
          const key = edgeKey(edge);
          const previous = state.edges.find((item) => edgeKey(item) === key);
          return {
            ...edge,
            appearedAt: previous?.appearedAt ?? (state.firstHydration || existingEdges.has(key) ? 0 : now)
          };
        });
        const exitingEdgeKeys = new Set();
        state.exitingEdges = [
          ...state.exitingEdges.filter((edge) => !nextEdgeKeys.has(edgeKey(edge)) && now - (edge.disappearingAt || now) < EXIT_ANIMATION_MS),
          ...newlyExitingEdges
        ].filter((edge) => {
          const key = edgeKey(edge);
          if (exitingEdgeKeys.has(key)) return false;
          exitingEdgeKeys.add(key);
          return true;
        });
        state.firstHydration = false;
        document.getElementById('node-count').textContent = `${state.nodes.length} nodes`;
        document.getElementById('edge-count').textContent = `${state.edges.length} links`;
        document.getElementById('empty').style.display = state.nodes.length ? 'none' : 'grid';
        renderLegend();
        renderResults(state.nodes);
        tick(80);
        draw();
      }
      function renderLegend() {
        const root = document.getElementById('legend');
        const types = [...new Set(state.nodes.map((node) => node.type))].sort();
        root.innerHTML = '';
        types.forEach((type) => {
          const item = document.createElement('span');
          item.className = 'pill';
          item.innerHTML = `<span class="swatch" style="background:${colors[type] || '#ccd6dd'}"></span>${type}`;
          root.appendChild(item);
        });
      }
      function renderResults(items) {
        const root = document.getElementById('results');
        root.innerHTML = '';
        items.slice(0, 20).forEach((item) => {
          const node = document.createElement('button');
          node.className = `item${item.id === state.selectedId ? ' active' : ''}`;
          node.innerHTML = `<strong>${escapeHtml(item.title)}</strong><div class="muted">${escapeHtml(item.type || '')}</div>`;
          node.onclick = () => selectNode(item.id);
          root.appendChild(node);
        });
      }
      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }
      function tick(iterations = 1) {
        const center = graphCenter();
        const nodeById = new Map(state.nodes.map((node) => [node.id, node]));
        for (let step = 0; step < iterations; step++) {
          for (let i = 0; i < state.nodes.length; i++) {
            for (let j = i + 1; j < state.nodes.length; j++) {
              const a = state.nodes[i];
              const b = state.nodes[j];
              const dx = b.x - a.x || 0.01;
              const dy = b.y - a.y || 0.01;
              const distance = Math.max(18, Math.hypot(dx, dy));
              const force = 900 / (distance * distance);
              const fx = (dx / distance) * force;
              const fy = (dy / distance) * force;
              a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
            }
          }
          state.edges.forEach((edge) => {
            const source = nodeById.get(edge.source);
            const target = nodeById.get(edge.target);
            if (!source || !target) return;
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const desired = 105 + (1 - Number(edge.weight || 0.5)) * 70;
            const force = (distance - desired) * 0.004;
            const fx = (dx / distance) * force;
            const fy = (dy / distance) * force;
            source.vx += fx; source.vy += fy; target.vx -= fx; target.vy -= fy;
          });
          state.nodes.forEach((node) => {
            node.vx += (center.x - node.x) * 0.0009;
            node.vy += (center.y - node.y) * 0.0009;
            node.vx *= 0.84;
            node.vy *= 0.84;
            if (state.dragging !== node.id) {
              node.x += node.vx;
              node.y += node.vy;
            }
          });
        }
      }
      function draw() {
        const now = performance.now();
        state.exitingNodes = state.exitingNodes.filter((node) => now - (node.disappearingAt || now) < EXIT_ANIMATION_MS);
        state.exitingEdges = state.exitingEdges.filter((edge) => now - (edge.disappearingAt || now) < EXIT_ANIMATION_MS);
        resizeCanvas();
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        ctx.save();
        ctx.translate(state.offsetX, state.offsetY);
        ctx.scale(state.scale, state.scale);
        const nodeById = new Map([...state.exitingNodes, ...state.nodes].map((node) => [node.id, node]));
        state.exitingEdges.forEach((edge) => drawEdge(edge, nodeById, now, true));
        state.edges.forEach((edge) => drawEdge(edge, nodeById, now, false));
        state.exitingNodes.forEach((node) => drawNode(node, now, true));
        state.nodes.forEach((node) => drawNode(node, now, false));
        ctx.restore();
      }
      function drawEdge(edge, nodeById, now, exiting) {
          const source = nodeById.get(edge.source);
          const target = nodeById.get(edge.target);
          if (!source || !target) return;
          const edgeAge = edge.appearedAt ? now - edge.appearedAt : EDGE_ANIMATION_MS;
          const edgeProgress = Math.min(1, Math.max(0, edgeAge / EDGE_ANIMATION_MS));
          const easedEdge = easeOutCubic(edgeProgress);
          const exitAge = exiting ? now - (edge.disappearingAt || now) : 0;
          const exitProgress = Math.min(1, Math.max(0, exitAge / EXIT_ANIMATION_MS));
          const exitAlpha = exiting ? 1 - easeOutCubic(exitProgress) : 1;
          const visibleProgress = exiting ? 1 - exitProgress : easedEdge;
          const targetX = source.x + (target.x - source.x) * visibleProgress;
          const targetY = source.y + (target.y - source.y) * visibleProgress;
          const active = state.selectedId && (edge.source === state.selectedId || edge.target === state.selectedId);
          const alpha = (active ? 0.82 : 0.22 + easedEdge * 0.16) * exitAlpha;
          ctx.strokeStyle = exiting ? `rgba(255,141,161,${Math.max(0, alpha)})` : active ? `rgba(216,240,110,${alpha})` : `rgba(130,150,160,${alpha})`;
          ctx.lineWidth = ((active ? 2.6 : 0.8 + Number(edge.weight || 0.5) * 1.8) + (1 - easedEdge) * 2.4) * (exiting ? 0.7 + exitAlpha * 0.3 : 1);
          ctx.beginPath();
          ctx.moveTo(source.x, source.y);
          ctx.lineTo(targetX, targetY);
          ctx.stroke();
          if (!exiting && edgeProgress < 1) {
            ctx.beginPath();
            ctx.arc(targetX, targetY, 4 + (1 - easedEdge) * 4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(216,240,110,${0.24 + (1 - easedEdge) * 0.52})`;
            ctx.fill();
          }
      }
      function drawNode(node, now, exiting) {
          const active = node.id === state.selectedId;
          const hovered = node.id === state.hoverId;
          const color = colors[node.type] || '#ccd6dd';
          const nodeAge = node.appearedAt ? now - node.appearedAt : NODE_ANIMATION_MS;
          const nodeProgress = Math.min(1, Math.max(0, nodeAge / NODE_ANIMATION_MS));
          const exitAge = exiting ? now - (node.disappearingAt || now) : 0;
          const exitProgress = Math.min(1, Math.max(0, exitAge / EXIT_ANIMATION_MS));
          const exitAlpha = exiting ? 1 - easeOutCubic(exitProgress) : 1;
          const easedNode = easeOutBack(nodeProgress);
          const pulse = nodeProgress < 1 ? Math.sin(nodeProgress * Math.PI) : 0;
          const radius = Math.max(2, node.radius * easedNode * (exiting ? 1 - exitProgress * 0.72 : 1));
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius + (active ? 7 : hovered ? 4 : 0) + pulse * 15, 0, Math.PI * 2);
          ctx.fillStyle = active ? `rgba(216,240,110,${0.18 * exitAlpha})` : hovered ? `rgba(255,255,255,${0.10 * exitAlpha})` : `rgba(255,255,255,${(0.04 + pulse * 0.08) * exitAlpha})`;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
          ctx.globalAlpha = exitAlpha;
          ctx.fillStyle = color;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.lineWidth = active ? 3 : 1.4;
          ctx.strokeStyle = exiting ? `rgba(255,141,161,${0.2 + exitAlpha * 0.55})` : nodeProgress < 1 ? `rgba(255,255,255,${0.25 + pulse * 0.55})` : active ? '#ffffff' : '#0b0f12';
          ctx.stroke();
          if (!exiting && (active || hovered || state.nodes.length < 36)) {
            ctx.font = '12px Inter, system-ui, sans-serif';
            ctx.fillStyle = nodeProgress < 1 ? `rgba(237,244,246,${nodeProgress})` : '#edf4f6';
            ctx.textAlign = 'center';
            ctx.fillText(truncate(node.title, 28), node.x, node.y + radius + 18);
          }
      }
      function easeOutCubic(value) {
        return 1 - Math.pow(1 - value, 3);
      }
      function easeOutBack(value) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(value - 1, 3) + c1 * Math.pow(value - 1, 2);
      }
      function truncate(value, max) {
        const text = String(value || '');
        return text.length > max ? `${text.slice(0, max - 1)}…` : text;
      }
      function screenToWorld(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (clientX - rect.left - state.offsetX) / state.scale,
          y: (clientY - rect.top - state.offsetY) / state.scale
        };
      }
      function nodeAt(clientX, clientY) {
        const point = screenToWorld(clientX, clientY);
        for (let i = state.nodes.length - 1; i >= 0; i--) {
          const node = state.nodes[i];
          if (Math.hypot(point.x - node.x, point.y - node.y) <= node.radius + 8) return node;
        }
        return null;
      }
      function selectNode(id) {
        state.selectedId = id;
        const node = state.nodes.find((item) => item.id === id);
        document.getElementById('selected').textContent = node ? JSON.stringify(node, null, 2) : 'Select a node in the graph.';
        renderRelationships(id);
        renderResults(state.nodes);
        draw();
      }
      function renderRelationships(id) {
        const root = document.getElementById('relationships');
        root.innerHTML = '';
        if (!id) return;
        const nodeById = new Map(state.nodes.map((node) => [node.id, node]));
        state.edges
          .filter((edge) => edge.source === id || edge.target === id)
          .forEach((edge) => {
            const otherId = edge.source === id ? edge.target : edge.source;
            const other = nodeById.get(otherId);
            const row = document.createElement('button');
            row.className = 'rel';
            row.innerHTML = `<strong>${escapeHtml(edge.kind)}</strong><div class="muted">${escapeHtml(other?.title || otherId)}</div><div class="muted">${escapeHtml(edge.reason || '')}</div>`;
            row.onclick = () => selectNode(otherId);
            root.appendChild(row);
          });
        if (!root.children.length) root.innerHTML = '<div class="muted">No direct relationships.</div>';
      }
      function animate() {
        tick(1);
        draw();
        state.animation = requestAnimationFrame(animate);
      }
      async function refreshGraph() {
        state.query = document.getElementById('query').value;
        const body = { action: 'graph', query: state.query, limit: 220 };
        if (state.viewFilter?.mode === 'custom') {
          body.node_ids = state.viewFilter.refs.map((ref) => ref.entity_id).filter(Boolean);
        }
        const payload = await callMemory(body);
        hydrateGraph(payload);
      }
      function handleMemoryChanged() {
        loadViewFilter().then(refreshGraph).catch(() => {
          // Keep the graph usable if a transient refresh fails.
        });
      }
      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin || !event.data || typeof event.data !== 'object') return;
        if (event.data.type === 'maverick.app.data-changed' && event.data.owner_app_id === 'memory') {
          handleMemoryChanged();
        }
      });
      function connectAppEvents() {
        if (!('WebSocket' in window)) return;
        if (state.appSocket && state.appSocket.readyState <= 1) return;
        if (state.appSocketReconnectTimer !== null) {
          window.clearTimeout(state.appSocketReconnectTimer);
          state.appSocketReconnectTimer = null;
        }
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}/api/apps/events/ws`);
        state.appSocket = socket;
        socket.onopen = () => {
          state.appSocketRetry = 0;
          handleMemoryChanged();
        };
        socket.onmessage = (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload.type === 'maverick.app.data-changed' && payload.owner_app_id === 'memory') {
              handleMemoryChanged();
            }
          } catch {
            // Ignore malformed event frames.
          }
        };
        socket.onerror = () => {
          socket.close();
        };
        socket.onclose = () => {
          if (state.appSocket !== socket) return;
          state.appSocket = null;
          const delay = Math.min(5000, 500 + state.appSocketRetry * 750);
          state.appSocketRetry += 1;
          state.appSocketReconnectTimer = window.setTimeout(connectAppEvents, delay);
        };
      }
      document.getElementById('search').onclick = async () => {
        const query = document.getElementById('query').value;
        const viewState = await callMemory({ action: 'set_view_filter', query });
        applyViewFilter(viewState.state?.view_filter);
        const payload = await callMemory({ action: 'search', query, limit: 50 });
        renderResults(payload.results || []);
        await refreshGraph();
      };
      document.getElementById('refresh').onclick = refreshGraph;
      document.getElementById('clear-custom-view').onclick = async () => {
        const payload = await callMemory({ action: 'clear_custom_view' });
        applyViewFilter(payload.state?.view_filter);
        await refreshGraph();
      };
      document.getElementById('fit').onclick = () => {
        state.scale = 1;
        state.offsetX = 0;
        state.offsetY = 0;
        tick(100);
        draw();
      };
      document.getElementById('remember').onclick = async () => {
        const payload = await callMemory({
          action: 'remember',
          title: document.getElementById('title').value,
          body: document.getElementById('body').value,
          type: document.getElementById('node-type').value
        });
        document.getElementById('title').value = '';
        document.getElementById('body').value = '';
        await refreshGraph();
        if (payload.node?.id) selectNode(payload.node.id);
      };
      document.getElementById('context').onclick = async () => {
        const query = document.getElementById('query').value;
        const payload = await callMemory({ action: 'context', query });
        document.getElementById('context-output').textContent = JSON.stringify(payload, null, 2);
      };
      canvas.addEventListener('mousedown', (event) => {
        const node = nodeAt(event.clientX, event.clientY);
        state.lastX = event.clientX;
        state.lastY = event.clientY;
        if (node) {
          state.dragging = node.id;
          selectNode(node.id);
        } else {
          state.panning = true;
        }
      });
      window.addEventListener('mousemove', (event) => {
        const node = nodeAt(event.clientX, event.clientY);
        state.hoverId = node?.id || null;
        if (state.dragging) {
          const dragged = state.nodes.find((item) => item.id === state.dragging);
          const point = screenToWorld(event.clientX, event.clientY);
          if (dragged) { dragged.x = point.x; dragged.y = point.y; dragged.vx = 0; dragged.vy = 0; }
        } else if (state.panning) {
          state.offsetX += event.clientX - state.lastX;
          state.offsetY += event.clientY - state.lastY;
        }
        state.lastX = event.clientX;
        state.lastY = event.clientY;
        draw();
      });
      window.addEventListener('mouseup', () => { state.dragging = null; state.panning = false; });
      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const before = screenToWorld(event.clientX, event.clientY);
        const factor = event.deltaY > 0 ? 0.92 : 1.08;
        state.scale = Math.max(0.45, Math.min(2.2, state.scale * factor));
        const rect = canvas.getBoundingClientRect();
        state.offsetX = event.clientX - rect.left - before.x * state.scale;
        state.offsetY = event.clientY - rect.top - before.y * state.scale;
        draw();
      }, { passive: false });
      window.addEventListener('resize', draw);
      window.parent?.postMessage({ type: 'maverick.app.ready', app_id: 'memory' }, window.location.origin);
      connectAppEvents();
      loadViewFilter().then(refreshGraph).catch(refreshGraph);
      animate();
    </script>
  </body>
</html>
