<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1&opsz=20..48&wght@400&display=swap"
    />
    <script>
      (() => {
        const theme = new URLSearchParams(location.search).get('loopino_theme');
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.dataset.loopinoTheme = theme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Settings Sidebar Widget</title>
    <script type="module" crossorigin src="/apps/settings/assets/widgets/settings-sidebar/index-CjblQCva.js"></script>
    <link rel="modulepreload" crossorigin href="/apps/settings/assets/pages-D4vzaPOW.js">
    <link rel="stylesheet" crossorigin href="/apps/settings/assets/index-C-KkVWwV.css">
  </head>
  <body>
    <div id="settings-sidebar-root"></div>
  </body>
</html>
