<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Preview Runtime</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --text: #ececec;
        font-family: "Avenir Next", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
      #root { position: relative; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root">
      <iframe id="preview" title="Website runtime document" sandbox="allow-scripts allow-forms"></iframe>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      let currentPreviewId = params.get('preview_id') || '';
      let currentMountedPreviewId = '';
      let previewTarget = previewTargetFromParams(params);
      const mediaPath = '/api/apps/website-studio/backend/media';
      const fileGatewayPrefix = '/api/apps/website-studio/backend/file/';
      const assetExtensions = /\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|css|js|mjs|mp3|m4v|mov|mp4|ogg|oga|ogv|webm|pdf)(?:[?#].*)?$/i;
      const localPrefixes = /^(?:assets|images|img|fonts|dist|css|js|media|frontend-website\/assets|frontend-website\/dist)\//i;
      const assetAttrs = ['src', 'href', 'data-src', 'data-bg', 'data-background', 'data-poster', 'poster'];
      const srcsetAttrs = ['srcset', 'data-srcset'];
      const root = document.getElementById('root');
      const initialFrame = document.getElementById('preview');
      const frameCacheLimit = 8;
      const assetBlobCacheLimit = 96;
      const assetBlobCacheMaxBytes = 8 * 1024 * 1024;
      let activeFrame = initialFrame;
      let loadRunId = 0;
      const documentCache = new Map();
      const frameCache = new Map();
      const assetGatewayCache = new Map();
      const assetBlobCache = new Map();
      const pendingAssetBlobFetches = new Map();
      const previewReports = [];
      window.__WEBSITE_STUDIO_PREVIEW_REPORT__ = null;
      window.__WEBSITE_STUDIO_PREVIEW_REPORTS__ = previewReports;
      window.__WEBSITE_STUDIO_ASSET_BLOB_CACHE_SIZE__ = () => assetBlobCache.size;

      window.addEventListener('message', (event) => {
        const data = event.data || {};
        if (event.origin !== window.location.origin || !data || data.type !== 'website-studio.preview.navigate') return;
        if (data.owner_app_id && data.owner_app_id !== 'website-studio') return;
        const nextPreviewId = String(data.preview_id || '').trim();
        if (!nextPreviewId) return;
        currentPreviewId = nextPreviewId;
        previewTarget = normalizePreviewTarget(data.target || {});
        replaceRuntimeLocation(data.preview_url || '');
        if (currentMountedPreviewId === currentPreviewId) {
          postTargetToMountedDocument();
          return;
        }
        if (activateCachedPreviewFrame(currentPreviewId)) {
          postTargetToMountedDocument();
          return;
        }
        loadPreviewDocument().catch(() => {
          mountHtml('<!doctype html><html><body style="margin:0;background:#080808;color:#ececec;font:14px system-ui;display:grid;place-content:center;min-height:100vh;">Preview unavailable</body></html>');
        });
      });

      window.addEventListener('message', (event) => {
        const data = event.data || {};
        if (!data || data.type !== 'website-studio.preview.report' || !isPreviewFrameWindow(event.source)) return;
        const envelope = {
          preview_id: data.preview_id || currentPreviewId,
          received_at: new Date().toISOString(),
          report: data.report || {}
        };
        window.__WEBSITE_STUDIO_PREVIEW_REPORT__ = envelope;
        previewReports.push(envelope);
        if (previewReports.length > 12) previewReports.shift();
        window.dispatchEvent(new CustomEvent('maverick.website-studio.preview-report', { detail: envelope }));
        try {
          window.parent?.postMessage({
            type: 'maverick.website-studio.preview-report',
            owner_app_id: 'website-studio',
            preview_id: envelope.preview_id,
            report: envelope.report
          }, window.location.origin);
        } catch {}
      });

      window.addEventListener('message', (event) => {
        const data = event.data || {};
        if (!data || data.type !== 'website-studio.preview.asset-cache-warm' || !isPreviewFrameWindow(event.source)) return;
        warmAssetBlobCache(data.url).catch(() => {});
      });

      function previewTargetFromParams(searchParams) {
        return normalizePreviewTarget({
          id: searchParams.get('target_id') || '',
          kind: searchParams.get('target_kind') || '',
          selector: searchParams.get('target_selector') || '',
          anchor: searchParams.get('target_anchor') || ''
        });
      }

      function normalizePreviewTarget(value) {
        const target = value && typeof value === 'object' ? value : {};
        return {
          id: String(target.id || '').slice(0, 180),
          kind: String(target.kind || '').slice(0, 40),
          selector: String(target.selector || '').slice(0, 500),
          anchor: String(target.anchor || '').slice(0, 180)
        };
      }

      function replaceRuntimeLocation(rawUrl) {
        if (!rawUrl) return;
        try {
          const url = new URL(String(rawUrl), window.location.origin);
          if (url.origin !== window.location.origin) return;
          if (url.pathname !== '/apps/website-studio/preview-runtime/' && url.pathname !== '/apps/website-studio/preview-runtime') return;
          window.history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
        } catch {}
      }

      function postTargetToMountedDocument() {
        try {
          activeFrame?.contentWindow?.postMessage({ type: 'website-studio.preview.target', target: previewTarget }, '*');
        } catch {}
      }

      function isPreviewFrameWindow(source) {
        for (const entry of frameCache.values()) {
          if (source === entry.frame.contentWindow) return true;
        }
        return false;
      }

      function revokeFrameUrl(entry) {
        if (!entry?.documentUrl) return;
        URL.revokeObjectURL(entry.documentUrl);
        entry.documentUrl = '';
      }

      function normalizedGatewayCacheKey(value) {
        try {
          const url = new URL(String(value || ''), window.location.origin);
          if (url.origin !== window.location.origin || !url.pathname.startsWith(fileGatewayPrefix)) return '';
          url.hash = '';
          return url.toString();
        } catch {
          return '';
        }
      }

      function cachedAssetBlobUrl(value, hash = '') {
        const entry = assetBlobCache.get(normalizedGatewayCacheKey(value));
        return entry?.objectUrl ? `${entry.objectUrl}${hash || ''}` : '';
      }

      function cacheAssetBlob(key, blob) {
        const cleanKey = normalizedGatewayCacheKey(key);
        if (!cleanKey || !(blob instanceof Blob) || !blob.size || blob.size > assetBlobCacheMaxBytes) return;
        const previous = assetBlobCache.get(cleanKey);
        if (previous?.objectUrl) URL.revokeObjectURL(previous.objectUrl);
        assetBlobCache.delete(cleanKey);
        assetBlobCache.set(cleanKey, {
          bytes: blob.size,
          contentType: blob.type || 'application/octet-stream',
          objectUrl: URL.createObjectURL(blob),
          updatedAt: Date.now()
        });
        pruneAssetBlobCache();
      }

      function pruneAssetBlobCache() {
        while (assetBlobCache.size > assetBlobCacheLimit) {
          const key = assetBlobCache.keys().next().value;
          if (key === undefined) break;
          const entry = assetBlobCache.get(key);
          if (entry?.objectUrl) URL.revokeObjectURL(entry.objectUrl);
          assetBlobCache.delete(key);
        }
      }

      async function warmAssetBlobCache(value) {
        const key = normalizedGatewayCacheKey(value);
        if (!key || assetBlobCache.has(key)) return;
        const pending = pendingAssetBlobFetches.get(key);
        if (pending) {
          await pending;
          return;
        }
        const request = (async () => {
          const response = await fetch(key, { cache: 'force-cache', credentials: 'omit' });
          if (!response.ok) return;
          const size = Number.parseInt(response.headers.get('content-length') || '0', 10);
          if (Number.isFinite(size) && size > assetBlobCacheMaxBytes) return;
          const blob = await response.blob();
          cacheAssetBlob(key, blob);
        })().finally(() => {
          pendingAssetBlobFetches.delete(key);
        });
        pendingAssetBlobFetches.set(key, request);
        await request;
      }

      function ensureFrameEntry(previewId) {
        const cleanPreviewId = String(previewId || '').trim() || 'preview';
        const cached = frameCache.get(cleanPreviewId);
        if (cached) {
          cached.lastUsed = Date.now();
          return cached;
        }
        const reusableInitialFrame = initialFrame && frameCache.size === 0;
        const frame = reusableInitialFrame ? initialFrame : document.createElement('iframe');
        frame.title = 'Website runtime document';
        frame.setAttribute('sandbox', 'allow-scripts allow-forms');
        frame.dataset.previewId = cleanPreviewId;
        frame.style.display = 'none';
        if (!reusableInitialFrame) root.appendChild(frame);
        const entry = { previewId: cleanPreviewId, frame, documentUrl: '', lastUsed: Date.now() };
        frameCache.set(cleanPreviewId, entry);
        pruneFrameCache();
        return entry;
      }

      function activateFrameEntry(entry) {
        if (!entry) return false;
        for (const item of frameCache.values()) {
          item.frame.style.display = item === entry ? 'block' : 'none';
          item.frame.toggleAttribute('aria-hidden', item !== entry);
          if (item === entry) item.frame.id = 'preview';
          else item.frame.removeAttribute('id');
        }
        activeFrame = entry.frame;
        currentMountedPreviewId = entry.previewId;
        entry.lastUsed = Date.now();
        return true;
      }

      function activateCachedPreviewFrame(previewId) {
        const entry = frameCache.get(String(previewId || '').trim());
        if (!entry?.documentUrl) return false;
        return activateFrameEntry(entry);
      }

      function pruneFrameCache() {
        while (frameCache.size > frameCacheLimit) {
          let oldestKey = '';
          let oldestEntry = null;
          for (const [key, entry] of frameCache.entries()) {
            if (entry.frame === activeFrame) continue;
            if (!oldestEntry || entry.lastUsed < oldestEntry.lastUsed) {
              oldestKey = key;
              oldestEntry = entry;
            }
          }
          if (!oldestKey || !oldestEntry) return;
          frameCache.delete(oldestKey);
          revokeFrameUrl(oldestEntry);
          oldestEntry.frame.remove();
        }
      }

      function mountHtml(html, sourceMap = {}) {
        const entry = ensureFrameEntry(currentPreviewId);
        revokeFrameUrl(entry);
        const origin = window.location.origin;
        const mediaSource = `${origin}${mediaPath}`;
        const fileGatewaySource = `${origin}${fileGatewayPrefix}`;
        const targetSourceMap = {
          ...(sourceMap || {}),
          target_id: previewTarget.id,
          target_kind: previewTarget.kind,
          target_selector: previewTarget.selector,
          target_anchor: previewTarget.anchor
        };
        const documentHtml = normalizePreviewDocument(String(html || '')
          .replaceAll('__WEBSITE_STUDIO_PREVIEW_ORIGIN__', origin)
          .replaceAll('__WEBSITE_STUDIO_PREVIEW_MEDIA_SOURCE__', mediaSource)
          .replaceAll('__WEBSITE_STUDIO_PREVIEW_FILE_GATEWAY_SOURCE__', fileGatewaySource)
          .replaceAll('__WEBSITE_STUDIO_PREVIEW_BACKEND_SOURCE__', fileGatewaySource), targetSourceMap);
        entry.documentUrl = URL.createObjectURL(new Blob([documentHtml], { type: 'text/html;charset=utf-8' }));
        entry.frame.removeAttribute('srcdoc');
        activateFrameEntry(entry);
        entry.frame.src = entry.documentUrl;
      }

      function normalizePreviewDocument(html, sourceMap = {}) {
        const document = new DOMParser().parseFromString(html, 'text/html');
        ensureUtf8Meta(document);
        expandPreviewCspForRuntimeAssets(document);
        normalizeDocumentAssetUrls(document, sourceMap);
        injectPreviewAssetBroker(document, sourceMap);
        injectPreviewTarget(document, sourceMap);
        injectPreviewObservability(document, sourceMap);
        return `<!doctype html>\n${document.documentElement.outerHTML}`;
      }

      function normalizeDocumentAssetUrls(document, sourceMap = {}) {
        for (const link of Array.from(document.querySelectorAll('link[href]'))) {
          const href = link.getAttribute('href') || '';
          const next = normalizeInitialAssetUrl(href, sourceMap);
          if (next) link.setAttribute('href', next);
        }
        for (const script of Array.from(document.querySelectorAll('script[src]'))) {
          const src = script.getAttribute('src') || '';
          const next = normalizeInitialAssetUrl(src, sourceMap);
          if (next) script.setAttribute('src', next);
        }
        for (const style of Array.from(document.querySelectorAll('style'))) {
          style.textContent = normalizeCssUrls(style.textContent || '', sourceMap);
        }
        for (const element of Array.from(document.querySelectorAll('[style]'))) {
          element.setAttribute('style', normalizeCssUrls(element.getAttribute('style') || '', sourceMap));
        }
        for (const script of Array.from(document.querySelectorAll('script:not([src])'))) {
          const scriptType = (script.getAttribute('type') || '').trim().toLowerCase();
          if (scriptType === 'application/x-website-studio-inline-script') continue;
          script.textContent = normalizeInlineMediaUrls(script.textContent || '', sourceMap);
        }
        for (const attr of assetAttrs) {
          for (const element of Array.from(document.querySelectorAll(`[${attr}]`))) {
            const value = element.getAttribute(attr) || '';
            const next = normalizeInitialAssetUrl(value, sourceMap);
            if (next) element.setAttribute(attr, next);
          }
        }
        for (const attr of srcsetAttrs) {
          for (const element of Array.from(document.querySelectorAll(`[${attr}]`))) {
            const next = normalizeSrcset(element.getAttribute(attr) || '', sourceMap);
            if (next) element.setAttribute(attr, next);
          }
        }
      }

      function normalizeInitialAssetUrl(value, sourceMap = {}) {
        const raw = String(value || '').trim();
        if (skipAssetUrl(raw)) return '';
        const gateway = gatewayUrlForPreviewAssetUrl(raw, sourceMap);
        if (gateway) return cachedAssetBlobUrl(gateway) || gateway;
        if (isPreviewAssetUrl(raw)) return cachedAssetBlobUrl(raw) || normalizedAssetDocumentUrl(raw);
        try {
          const parsed = new URL(raw, window.location.origin);
          if (isPreviewAssetUrl(parsed.toString())) return parsed.toString();
          if (parsed.origin !== window.location.origin) return '';
          const cleanPath = parsed.pathname.replace(/^\/+/, '');
          if (!isLocalAssetCandidate(cleanPath + parsed.search + parsed.hash, sourceMap)) return '';
          return mediaUrlForPath(cleanPath + parsed.search + parsed.hash, sourceMap);
        } catch {
          const cleanPath = raw.replace(/^\/+/, '');
          return isLocalAssetCandidate(cleanPath, sourceMap) ? mediaUrlForPath(cleanPath, sourceMap) : '';
        }
      }

      function mediaUrlForPath(path, sourceMap = {}) {
        let clean = String(path || '').replace(/^\/+/, '');
        if (!clean) return '';
        let hash = '';
        const hashIndex = clean.indexOf('#');
        if (hashIndex >= 0) {
          hash = clean.slice(hashIndex);
          clean = clean.slice(0, hashIndex);
        }
        let assetQuery = '';
        const queryIndex = clean.indexOf('?');
        if (queryIndex >= 0) {
          assetQuery = clean.slice(queryIndex + 1);
          clean = clean.slice(0, queryIndex);
        }
        if (!clean) return '';
        const gateway = gatewayUrlForPath(clean, sourceMap);
        if (gateway) return cachedAssetBlobUrl(gateway, hash) || gateway + hash;
        const url = new URL(mediaPath, window.location.origin);
        url.searchParams.set('preview_id', currentPreviewId);
        url.searchParams.set('path', clean);
        if (assetQuery) url.searchParams.set('asset_query', assetQuery);
        return url.toString() + hash;
      }

      function gatewayUrlForPath(path, sourceMap = {}) {
        const gateway = sourceMap?.asset_gateway && typeof sourceMap.asset_gateway === 'object' ? sourceMap.asset_gateway : {};
        const clean = String(path || '').replace(/^\/+/, '').split(/[?#]/, 1)[0];
        const value = gateway[clean];
        if (!value) return '';
        try {
          const url = new URL(String(value), window.location.origin);
          if (url.origin === window.location.origin && url.pathname.startsWith(fileGatewayPrefix)) return url.toString();
        } catch {}
        return '';
      }

      function gatewayUrlForPreviewAssetUrl(rawUrl, sourceMap = {}) {
        if (!isPreviewMediaUrl(rawUrl)) return '';
        try {
          const parsed = new URL(String(rawUrl || ''), window.location.origin);
          const assetPath = parsed.searchParams.get('path') || '';
          const gateway = gatewayUrlForPath(assetPath, sourceMap);
          return gateway ? gateway + parsed.hash : '';
        } catch {
          return '';
        }
      }

      function isLocalAssetCandidate(value, sourceMap = {}) {
        const clean = String(value || '').replace(/^\/+/, '');
        if (!clean || clean.startsWith('../')) return false;
        if (assetExtensions.test(clean) || localPrefixes.test(clean)) return true;
        const refs = Array.isArray(sourceMap?.asset_refs) ? sourceMap.asset_refs : [];
        const pathOnly = clean.split(/[?#]/, 1)[0];
        return refs.some((item) => String(item || '').replace(/^\/+/, '') === pathOnly);
      }

      function normalizeCssUrls(css, sourceMap = {}) {
        const replacements = [];
        const pattern = /url\(\s*(['"]?)(.*?)\1\s*\)/gi;
        for (const match of String(css || '').matchAll(pattern)) {
          const value = match[2] || '';
          const next = normalizeInitialAssetUrl(value, sourceMap);
          if (!next) continue;
          replacements.push({
            start: match.index,
            end: match.index + match[0].length,
            value: `url("${next.replace(/"/g, '\\"')}")`
          });
        }
        return applyReplacements(String(css || ''), replacements);
      }

      function normalizeSrcset(value, sourceMap = {}) {
        const items = [];
        for (const item of String(value || '').split(',')) {
          const trimmed = item.trim();
          if (!trimmed) continue;
          const parts = trimmed.split(/\s+/);
          const next = normalizeInitialAssetUrl(parts[0], sourceMap);
          if (next) parts[0] = next;
          items.push(parts.join(' '));
        }
        return items.join(', ');
      }

      function normalizeInlineMediaUrls(text, sourceMap = {}) {
        const replacements = [];
        const pattern = /(?:https?:\/\/[^"'`\s<>)]+)?\/api\/apps\/website-studio\/backend\/(?:media\?[^"'`\s<>)]+|file\/[A-Za-z0-9_-]+(?:#[^"'`\s<>)]+)?)/gi;
        for (const match of String(text || '').matchAll(pattern)) {
          const value = match[0] || '';
          if (!isPreviewAssetUrl(value)) continue;
          const gateway = gatewayUrlForPreviewAssetUrl(value, sourceMap);
          replacements.push({
            start: match.index,
            end: match.index + value.length,
            value: gateway || normalizedAssetDocumentUrl(value)
          });
        }
        return applyReplacements(String(text || ''), replacements);
      }

      function applyReplacements(text, replacements) {
        let result = '';
        let offset = 0;
        for (const replacement of replacements.sort((a, b) => a.start - b.start)) {
          result += text.slice(offset, replacement.start) + replacement.value;
          offset = replacement.end;
        }
        return result + text.slice(offset);
      }

      function normalizedMediaDocumentUrl(rawUrl) {
        return new URL(rawUrl, window.location.origin).toString();
      }

      function normalizedAssetDocumentUrl(rawUrl) {
        return normalizedMediaDocumentUrl(rawUrl);
      }

      function isPreviewMediaUrl(value) {
        try {
          const parsed = new URL(String(value || '').trim(), window.location.origin);
          return parsed.origin === window.location.origin && parsed.pathname === mediaPath;
        } catch {
          return false;
        }
      }

      function isPreviewFileGatewayUrl(value) {
        try {
          const parsed = new URL(String(value || '').trim(), window.location.origin);
          return parsed.origin === window.location.origin && parsed.pathname.startsWith(fileGatewayPrefix);
        } catch {
          return false;
        }
      }

      function isPreviewAssetUrl(value) {
        return isPreviewMediaUrl(value) || isPreviewFileGatewayUrl(value);
      }

      function skipAssetUrl(value) {
        const lowered = String(value || '').trim().toLowerCase();
        return !lowered || lowered.startsWith('#') || /^(?:data|blob|javascript|mailto|tel|about):/.test(lowered) || /[{}]/.test(value);
      }

      function ensureUtf8Meta(document) {
        const head = document.head || document.documentElement.insertBefore(document.createElement('head'), document.body || null);
        if (head.querySelector('meta[charset]')) return;
        const meta = document.createElement('meta');
        meta.setAttribute('charset', 'utf-8');
        head.insertBefore(meta, head.firstChild);
      }

      function expandPreviewCspForRuntimeAssets(document) {
        const meta = document.querySelector('meta[http-equiv="Content-Security-Policy" i]');
        if (!meta) return;
        const mediaSource = `${window.location.origin}${mediaPath}`;
        const fileGatewaySource = `${window.location.origin}${fileGatewayPrefix}`;
        const directives = String(meta.getAttribute('content') || '').split(';').map((item) => item.trim()).filter(Boolean);
        const next = directives.map((directive) => {
          const name = directive.split(/\s+/, 1)[0];
          if (!['img-src', 'media-src', 'font-src', 'style-src', 'script-src'].includes(name)) {
            return directive;
          }
          const extras = ['blob:', mediaSource, fileGatewaySource];
          if (name === 'style-src') extras.push('data:');
          const missing = extras.filter((value) => !directive.includes(value));
          return missing.length ? `${directive} ${missing.join(' ')}` : directive;
        });
        meta.setAttribute('content', next.join('; '));
      }

      function injectPreviewTarget(document, sourceMap) {
        const head = document.head || document.documentElement.insertBefore(document.createElement('head'), document.body || null);
        const style = document.createElement('style');
        style.setAttribute('data-website-studio-target-style', '');
        style.textContent = '[data-website-studio-target="active"]{outline:3px solid #ffbf47!important;outline-offset:4px!important;scroll-margin:12vh!important;}';
        const script = document.createElement('script');
        script.setAttribute('data-website-studio-target-probe', '');
        script.textContent = `
(() => {
  let target = ${JSON.stringify(previewTarget).replace(/</g, '\\u003c')};
  const normalizeTarget = (value) => {
    const next = value && typeof value === 'object' ? value : {};
    return {
      id: String(next.id || '').slice(0, 180),
      kind: String(next.kind || '').slice(0, 40),
      selector: String(next.selector || '').slice(0, 500),
      anchor: String(next.anchor || '').slice(0, 180)
    };
  };
  const clear = () => {
    for (const node of Array.from(document.querySelectorAll('[data-website-studio-target="active"]'))) {
      try { node.removeAttribute('data-website-studio-target'); } catch {}
    }
  };
  const findTarget = () => {
    if (target.selector) {
      try {
        const node = document.querySelector(target.selector);
        if (node) return node;
      } catch {}
    }
    if (target.anchor) {
      const id = String(target.anchor || '').replace(/^#/, '');
      if (id) {
        const escaped = window.CSS?.escape ? CSS.escape(id) : id.replace(/["\\\\]/g, '\\\\$&');
        return document.getElementById(id) || document.querySelector('[name="' + escaped + '"]');
      }
    }
    return null;
  };
  const mark = () => {
    clear();
    const node = findTarget();
    window.__WEBSITE_STUDIO_TARGET__ = { ...target, found: Boolean(node) };
    if (!node) return;
    try {
      node.setAttribute('data-website-studio-target', 'active');
      node.scrollIntoView({ block: 'center', inline: 'nearest' });
    } catch {}
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(mark), { once: true });
  else requestAnimationFrame(mark);
  window.setTimeout(mark, 600);
  window.addEventListener('message', (event) => {
    if (event.source !== parent) return;
    const data = event.data || {};
    if (!data || data.type !== 'website-studio.preview.target') return;
    target = normalizeTarget(data.target || {});
    requestAnimationFrame(mark);
    window.setTimeout(mark, 250);
  });
})();
        `.trim();
        head.appendChild(style);
        head.appendChild(script);
      }

      function injectPreviewObservability(document, sourceMap) {
        const head = document.head || document.documentElement.insertBefore(document.createElement('head'), document.body || null);
        const mapScript = document.createElement('script');
        mapScript.id = 'website-studio-source-map';
        mapScript.type = 'application/json';
        const mountedPreviewId = currentPreviewId;
        mapScript.textContent = JSON.stringify({ preview_id: mountedPreviewId, ...(sourceMap || {}) }).replace(/</g, '\\u003c');

        const probe = document.createElement('script');
        probe.setAttribute('data-website-studio-preview-probe', '');
        probe.textContent = `
(() => {
  const safeString = (value, max = 240) => String(value ?? '').replace(/\\s+/g, ' ').trim().slice(0, max);
  const normalizeUrl = (value) => {
    if (String(value || '').startsWith('blob:')) return 'blob:preview-document';
    if (String(value || '').startsWith('data:')) return 'data:preview-asset';
    try {
