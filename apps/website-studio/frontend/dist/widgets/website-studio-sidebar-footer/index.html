<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Studio Action</title>
    <style>
      :root { color-scheme: dark; --text: #ececec; --surface: rgba(12,12,14,.58); --edge: inset 0 0 0 1px rgba(255,255,255,.075), inset 0 1px 0 rgba(255,255,255,.14); font-family: "Avenir Next", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
      .actions { display: grid; grid-template-columns: minmax(0, 1fr) 2.65rem; align-items: center; gap: .42rem; width: 100%; height: 100%; }
      button { display: grid; grid-template-columns: 1rem auto; place-content: center; align-items: center; gap: .38rem; width: 100%; min-width: 0; height: 2.65rem; border: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--edge); color: var(--text); font: inherit; font-size: .76rem; cursor: pointer; white-space: nowrap; }
      button:hover { background: rgba(255,255,255,.105); }
      .info-button { grid-template-columns: 1rem; padding: 0; }
      .icon { position: relative; display: block; width: 1rem; height: 1rem; color: currentColor; }
      .icon-add::before,
      .icon-add::after { content: ""; position: absolute; top: 50%; left: 50%; width: .72rem; height: 1.5px; border-radius: 999px; background: currentColor; transform: translate(-50%, -50%); }
      .icon-add::after { width: 1.5px; height: .72rem; }
      .icon-info { display: grid; place-items: center; font-size: .86rem; font-weight: 600; line-height: 1; }
    </style>
  </head>
  <body>
    <div class="actions">
      <button id="create" type="button"><span class="icon icon-add" aria-hidden="true"></span><span>New</span></button>
      <button id="info" class="info-button" type="button" aria-label="Info"><span class="icon icon-info" aria-hidden="true">i</span></button>
    </div>
    <script>
      const widgetId = 'website-studio-sidebar-footer';
      function openCreateFlow() {
        window.parent?.postMessage({ type: 'maverick.widget.open-app', app_id: 'website-studio', params: { new_website_request_id: crypto.randomUUID() } }, window.location.origin);
        window.parent?.postMessage({ type: 'maverick.shell.sidebar.close' }, window.location.origin);
      }
      function openInfoPanel() {
        window.parent?.postMessage({ type: 'maverick.widget.open-app', app_id: 'website-studio', params: { website_info: '1', app_page: 'info' } }, window.location.origin);
        window.parent?.postMessage({ type: 'maverick.shell.sidebar.close' }, window.location.origin);
      }
      function postState() {
        window.parent?.postMessage({ type: 'maverick.widget.primary-action.state', owner_app_id: 'website-studio', widget_id: widgetId, available: true, label: 'New' }, window.location.origin);
      }
      function requestResize() {
        window.parent?.postMessage({ type: 'maverick.widget.resize', owner_app_id: 'website-studio', widget_id: widgetId, height: '2.65rem' }, window.location.origin);
      }
      document.getElementById('create').addEventListener('click', openCreateFlow);
      document.getElementById('info').addEventListener('click', openInfoPanel);
      window.addEventListener('message', event => {
        if (event.origin !== window.location.origin || !event.data || event.data.owner_app_id !== 'website-studio' || event.data.widget_id !== widgetId) return;
        if (event.data.type === 'maverick.widget.primary-action.query') postState();
        if (event.data.type === 'maverick.widget.primary-action.invoke') openCreateFlow();
      });
      requestResize();
      postState();
    </script>
  </body>
</html>
