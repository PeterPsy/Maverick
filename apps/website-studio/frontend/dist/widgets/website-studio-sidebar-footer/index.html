<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Studio Action</title>
    <style>
      :root { color-scheme: dark; --text: #ececec; --surface: rgba(12,12,14,.58); --edge: inset 0 0 0 1px rgba(255,255,255,.075), inset 0 1px 0 rgba(255,255,255,.14); font-family: "Avenir Next", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
      button { display: grid; grid-template-columns: auto auto; place-content: center; align-items: center; gap: .38rem; width: 100%; height: 2.65rem; border: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--edge); color: var(--text); font: inherit; font-size: .76rem; cursor: pointer; }
      .icon { font-family: "Material Symbols Rounded", "Avenir Next", system-ui, sans-serif; font-size: 1rem; line-height: 1; }
    </style>
  </head>
  <body>
    <button id="create"><span class="material-symbols-rounded icon" aria-hidden="true">add</span><span>New website</span></button>
    <script>
      const widgetId = 'website-studio-sidebar-footer';
      function openFlow() {
        window.parent?.postMessage({ type: 'maverick.widget.open-app', app_id: 'website-studio', params: { new_website_request_id: crypto.randomUUID() } }, window.location.origin);
      }
      function postState() {
        window.parent?.postMessage({ type: 'maverick.widget.primary-action.state', owner_app_id: 'website-studio', widget_id: widgetId, available: true, label: 'New website' }, window.location.origin);
      }
      document.getElementById('create').addEventListener('click', openFlow);
      window.addEventListener('message', event => {
        if (event.origin !== window.location.origin || !event.data || event.data.owner_app_id !== 'website-studio' || event.data.widget_id !== widgetId) return;
        if (event.data.type === 'maverick.widget.primary-action.query') postState();
        if (event.data.type === 'maverick.widget.primary-action.invoke') openFlow();
      });
      postState();
    </script>
  </body>
</html>
