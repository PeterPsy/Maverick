<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Studio Sitemap</title>
    <style>
      :root { color-scheme: dark; --text: #ececec; --muted: rgba(236,236,236,.66); --soft: rgba(236,236,236,.42); --surface: rgba(12,12,14,.58); --hover: rgba(255,255,255,.105); --border: rgba(255,255,255,.08); --edge: inset 0 0 0 1px rgba(255,255,255,.075), inset 0 1px 0 rgba(255,255,255,.14); font-family: "Avenir Next", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif; }
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; color: var(--text); }
      .widget { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; }
      .search { position: absolute; top: 3.12rem; left: 0; right: 0; z-index: 3; display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: .48rem; height: 2.65rem; border: 1px solid rgba(255,255,255,.05); border-radius: 22px; background: var(--surface); box-shadow: var(--edge); padding: 0 .72rem; }
      .search input { min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; }
      .site-select-frame { position: absolute; top: 6.05rem; left: 0; right: 0; z-index: 3; height: 2.65rem; border: 1px solid rgba(255,255,255,.05); border-radius: 22px; background: var(--surface); box-shadow: var(--edge); padding: 0 .72rem; }
      .site-select-frame select { width: 100%; height: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; }
      .list { height: 100%; min-height: 0; overflow-y: auto; padding: 9.42rem 0 7.15rem; scrollbar-width: none; }
      button { width: 100%; min-height: 42px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 8px; margin: 0 0 6px; border: 1px solid transparent; border-radius: 22px; background: transparent; color: var(--text); padding: 0 .72rem; font: inherit; text-align: left; cursor: pointer; }
      button:hover { background: var(--hover); border-color: var(--border); }
      span, small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      small { color: var(--soft); }
      .label { display: grid; min-width: 0; }
      .meta { display: flex; align-items: center; justify-content: flex-end; gap: 5px; min-width: 0; }
      .kind { color: var(--soft); font-size: .68rem; }
      .badge { max-width: 6.5rem; border: 1px solid rgba(255,255,255,.08); border-radius: 999px; color: var(--muted); font-size: .64rem; padding: 2px 6px; }
      .badge.warn { color: #f6d58f; border-color: rgba(246,213,143,.28); }
      .empty { padding: 6.7rem .72rem 0; color: var(--muted); font-size: .82rem; }
    </style>
  </head>
  <body>
    <div id="root" class="widget">
      <label class="search"><span>⌕</span><input id="query" placeholder="Search sitemap"></label>
      <label class="site-select-frame"><select id="siteSelect" aria-label="Website site"></select></label>
      <div id="list" class="list"></div>
    </div>
    <script>
      const list = document.getElementById('list');
      const query = document.getElementById('query');
      const siteSelect = document.getElementById('siteSelect');
      let sites = [];
      let pages = [];
      let routes = [];
      let assets = [];
      let activeSiteId = '';
      async function backend(body) {
        const response = await fetch('/api/apps/website-studio/backend', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!response.ok) throw new Error('backend request failed');
        return response.json();
      }
      async function load() {
        const sitePayload = await backend({ action: 'sites_list' });
        sites = sitePayload.items || [];
        const selectableSites = sites.filter(item => item.status !== 'archived');
        siteSelect.replaceChildren();
        if (selectableSites.length) {
          for (const site of selectableSites) {
            const option = document.createElement('option');
            option.value = String(site.id);
            option.textContent = String(site.display_name || site.id);
            siteSelect.append(option);
          }
        } else {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'No active websites yet';
          siteSelect.append(option);
        }
        const site = selectableSites.find(item => item.id === activeSiteId) || selectableSites.find(item => item.is_active) || selectableSites[0];
        if (!site) { list.replaceChildren(); return; }
        activeSiteId = site.id;
        siteSelect.value = activeSiteId;
        const map = await backend({ action: 'sitemap', site_id: site.id });
        pages = map.items || [];
        routes = map.routes || [];
        assets = map.assets || [];
        render();
      }
      function render() {
        const needle = query.value.toLowerCase();
        const items = sitemapItems();
        const filtered = items.filter(item => item.label.toLowerCase().includes(needle) || item.subtitle.toLowerCase().includes(needle));
        list.replaceChildren();
        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No routes match.';
          list.append(empty);
          return;
        }
        for (const item of filtered) {
          const row = document.createElement('button');
          row.dataset.kind = item.kind;
          row.dataset.id = item.id;
          row.dataset.page = item.page_id || '';
          row.dataset.route = item.route || '';
          const label = document.createElement('span');
          label.className = 'label';
          const title = document.createElement('span');
          title.textContent = item.label;
          const kind = document.createElement('small');
          kind.className = 'kind';
          kind.textContent = item.subtitle;
          label.append(title, kind);
          const meta = document.createElement('span');
          meta.className = 'meta';
          const status = document.createElement('small');
          status.className = item.warning ? 'badge warn' : 'badge';
          status.textContent = item.status;
          meta.append(status);
          row.append(label, meta);
          list.append(row);
        }
      }
      function sitemapItems() {
        const pageItems = pages.map(page => ({
          kind: 'page',
          id: String(page.id),
          page_id: String(page.id),
          route: String(page.route || ''),
          label: String(page.route || page.title || page.id),
          subtitle: String(page.title || 'page'),
          status: String(page.warnings?.length ? 'missing asset' : page.status || 'draft'),
          warning: Boolean(page.warnings?.length)
        }));
        const pageRouteIds = new Set(pages.map(page => String(page.id)));
        const routeItems = routes
          .filter(route => !route.page_id || !pageRouteIds.has(String(route.page_id)))
          .map(route => ({
            kind: 'route',
            id: String(route.id),
            page_id: String(route.page_id || ''),
            route: String(route.route || ''),
            label: String(route.route || route.id),
            subtitle: String(route.kind || 'route'),
            status: String(route.warnings?.length ? 'broken' : route.status || 'route'),
            warning: Boolean(route.warnings?.length || route.status === 'broken')
          }));
        const assetItems = assets.map(asset => ({
          kind: 'asset',
          id: String(asset.id),
          page_id: '',
          route: '',
          label: String(asset.path || asset.id),
          subtitle: String(asset.kind || 'asset'),
          status: String(asset.status || 'asset'),
          warning: Boolean(asset.warnings?.length)
        }));
        return [...pageItems, ...routeItems, ...assetItems];
      }
      query.addEventListener('input', render);
      siteSelect.addEventListener('change', async () => {
        activeSiteId = siteSelect.value;
        if (activeSiteId) {
          await backend({ action: 'site_set_active', site_id: activeSiteId }).catch(() => null);
        }
        window.parent?.postMessage({ type: 'maverick.widget.open-app', app_id: 'website-studio', params: { site_id: activeSiteId } }, window.location.origin);
        load();
      });
      list.addEventListener('click', event => {
        const row = event.target.closest('button[data-kind]');
        if (!row) return;
        const kind = row.dataset.kind;
        const id = row.dataset.id;
        const params = { site_id: activeSiteId, app_page: `${kind}s/${id}` };
        if (kind === 'page') {
          params.page_id = row.dataset.page || id;
          params.route = row.dataset.route || '';
        }
        if (kind === 'route') {
          params.route_id = id;
          params.route = row.dataset.route || '';
        }
        if (kind === 'asset') {
          params.asset_id = id;
        }
        window.parent?.postMessage({ type: 'maverick.widget.open-app', app_id: 'website-studio', params }, window.location.origin);
        window.parent?.postMessage({ type: 'maverick.shell.sidebar.close' }, window.location.origin);
      });
      window.addEventListener('message', event => {
        if (event.origin !== window.location.origin || !event.data || typeof event.data !== 'object') return;
        if (event.data.type === 'maverick.widget.data-changed' && event.data.owner_app_id === 'website-studio') {
          load();
        }
        if (event.data.type !== 'maverick.widget.context-changed') return;
        const params = event.data.context?.content?.payload?.active_app_params || {};
        if (params.site_id && params.site_id !== activeSiteId) {
          activeSiteId = String(params.site_id);
          load();
        }
      });
      load().catch(() => {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Sitemap unavailable.';
        list.replaceChildren(empty);
      });
    </script>
  </body>
</html>
