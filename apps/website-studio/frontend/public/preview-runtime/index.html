<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Preview Runtime</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --text: #ececec;
        font-family: "Avenir Next", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
      #root { position: relative; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root">
      <iframe id="preview" title="Website runtime document" sandbox="allow-scripts allow-forms"></iframe>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const previewId = params.get('preview_id') || '';
      const frame = document.getElementById('preview');

      async function load() {
        if (!previewId) throw new Error('preview_id is required');
        const response = await fetch('/api/apps/website-studio/backend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'preview_document', preview_id: previewId })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(String(payload.detail || payload.error || 'preview request failed'));
        frame.srcdoc = String(payload.html || '');
      }

      load().catch(() => {
        frame.srcdoc = '<!doctype html><html><body style="margin:0;background:#080808;color:#ececec;font:14px system-ui;display:grid;place-content:center;min-height:100vh;">Preview unavailable</body></html>';
      });
    </script>
  </body>
</html>
