[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-v3"
version = "0.1.0"
description = "Maverick v3 clean-slate platform core scaffold"
requires-python = ">=3.12"
dependencies = [
    "uvicorn[standard]>=0.30",
]

[project.scripts]
maverick = "core.app_sdk.cli:main"

[tool.setuptools]
include-package-data = true
