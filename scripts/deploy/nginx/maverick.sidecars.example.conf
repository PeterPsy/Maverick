server {
    listen 80;
    listen [::]:80;
    server_name *.sidecars.{{HOSTNAME}};

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.sidecars.{{HOSTNAME}};
    client_max_body_size 40m;

    ssl_certificate {{SIDECAR_TLS_CERT_PATH}};
    ssl_certificate_key {{SIDECAR_TLS_CERT_KEY_PATH}};
    ssl_session_cache shared:MaverickSidecarSSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Sidecar responses carry the core-owned CSP frame-ancestors policy. Do not
    # add X-Frame-Options here: the platform embeds this distinct origin.
    location / {
        proxy_pass http://{{BIND_HOST}}:{{CORE_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
