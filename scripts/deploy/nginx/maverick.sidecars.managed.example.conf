map $ssl_server_name $maverick_browser_origin_cert_host {
    default {{BROWSER_ORIGIN_DEFAULT_HOST}};
    "~^(?<reserved_browser_origin>(?:af|sc)-[a-f0-9]{24}\.sidecars\.{{HOSTNAME_REGEX}})$" $reserved_browser_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.sidecars.{{HOSTNAME}};

    location ^~ /.well-known/acme-challenge/ {
        root {{BROWSER_ORIGIN_ACME_WEBROOT}};
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.sidecars.{{HOSTNAME}};
    client_max_body_size 40m;

    # Only Core-derived af-/sc- names pass the map. An unprovisioned exact
    # name has no readable key and therefore fails during the TLS handshake.
    ssl_certificate {{BROWSER_ORIGIN_TLS_ROOT}}/served/hosts/$maverick_browser_origin_cert_host/current/fullchain.pem;
    ssl_certificate_key {{BROWSER_ORIGIN_TLS_ROOT}}/served/hosts/$maverick_browser_origin_cert_host/current/privkey.pem;
    ssl_session_cache shared:MaverickSidecarSSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Core stamps the exact frame-ancestors policy. X-Frame-Options from the
    # platform virtual host must not cross this distinct-origin boundary.
    location / {
        proxy_pass http://{{BIND_HOST}}:{{CORE_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
